<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Copy Generator - FreeAdStore</title>
<meta name="description" content="Write platform-specific ad copy for Google, Meta, LinkedIn, TikTok, X, and YouTube. 5 variants per click. Free, no signup.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--text:#1a1a1a;--muted:#6b7280;--accent:#ef4444;--accent-light:rgba(239,68,68,.08);--accent-hover:#dc2626;--panel:#ffffff;--line:#e5e7eb;--radius:10px;--green:#22c55e;--yellow:#eab308;--red:#ef4444}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a.back{display:inline-block;padding:14px 16px;color:var(--accent);text-decoration:none;font-weight:600;font-size:.85rem}
a.back:hover{text-decoration:underline}
a.back span{font-weight:400;color:var(--muted)}

/* SPLIT LAYOUT */
.app{display:flex;height:100vh}
.sidebar{width:360px;min-width:360px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.sidebar-scroll{flex:1;overflow-y:auto;padding:0 20px 20px}
.sidebar-head{padding:16px 20px 0;flex-shrink:0}
.sidebar-head h1{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:700;margin-bottom:2px;color:var(--text)}
.sidebar-head p{font-size:.75rem;color:var(--muted);margin-bottom:14px;line-height:1.4}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
.main-header{padding:16px 24px 0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.main-header h2{font-size:.85rem;font-weight:700;color:var(--text)}
.main-scroll{flex:1;overflow-y:auto;padding:16px 24px 24px}

/* PANELS */
.panel{margin-bottom:16px}
.panel-title{font-size:.72rem;font-weight:700;color:var(--text);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
label{font-size:.7rem;color:var(--muted);display:block;margin:8px 0 4px;font-weight:500}
input[type=text],textarea,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:.85rem;font-family:inherit;background:var(--bg);outline:none;transition:border-color .15s}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%236b7280' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}

/* PILLS */
.pill-row{display:flex;gap:5px;flex-wrap:wrap}
.pill{padding:5px 12px;border:1px solid var(--line);border-radius:8px;font-size:.72rem;font-weight:600;cursor:pointer;background:var(--panel);font-family:inherit;transition:all .12s;color:var(--text)}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* BUTTONS */
.btn{padding:10px 20px;border-radius:var(--radius);font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(239,68,68,.3)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:7px 14px;font-size:.75rem;font-weight:600}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 12px;font-size:.72rem}

/* CARD GRID */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.ad-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:all .2s}
.ad-card:hover{border-color:#d1d5db;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.card-header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card-angle{font-size:.72rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:5px}
.card-angle-icon{width:16px;height:16px;border-radius:4px;background:var(--accent-light);display:flex;align-items:center;justify-content:center}
.card-angle-icon svg{width:10px;height:10px;color:var(--accent)}
.card-copy-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.68rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .12s;display:flex;align-items:center;gap:4px}
.card-copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.card-copy-btn.copied{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.06)}
.card-body{padding:16px}
.ad-field{margin-bottom:12px}
.ad-field:last-child{margin-bottom:0}
.ad-field-label{font-size:.65rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.ad-field-text{font-size:.88rem;line-height:1.45;color:var(--text);word-break:break-word}
.char-count{font-size:.62rem;font-weight:600;font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:4px}
.char-green{color:var(--green);background:rgba(34,197,94,.08)}
.char-yellow{color:#ca8a04;background:rgba(234,179,8,.1)}
.char-red{color:var(--red);background:rgba(239,68,68,.08)}
.card-footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card-platform{font-size:.65rem;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:4px}
.card-platform svg{width:12px;height:12px;opacity:.6}

/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:400px;text-align:center;padding:40px}
.empty-icon{width:80px;height:80px;border-radius:20px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.empty-icon svg{width:36px;height:36px;color:var(--accent)}
.empty-state h3{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700;margin-bottom:6px}
.empty-state p{font-size:.82rem;color:var(--muted);max-width:320px;line-height:1.5}

/* EXPORT BAR */
.export-bar{padding:12px 24px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:8px;flex-shrink:0;align-items:center;justify-content:flex-end}
.export-bar .count{font-size:.72rem;color:var(--muted);margin-right:auto}

/* PLATFORM LIMITS INFO */
.limits-box{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:.7rem;color:var(--muted);line-height:1.6}
.limits-box strong{color:var(--text);font-weight:600}
.limits-row{display:flex;justify-content:space-between;padding:2px 0}
.limits-row span:last-child{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}

/* SEPARATOR */
.sep{height:1px;background:var(--line);margin:16px 0}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 20px;border-radius:10px;font-size:.78rem;font-weight:600;opacity:0;transition:all .3s ease;z-index:1000;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  .app{flex-direction:column;height:auto}
  .sidebar{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--line);max-height:none}
  .main{min-height:60vh}
  .card-grid{grid-template-columns:1fr}
}
@media(max-width:500px){
  .card-grid{grid-template-columns:1fr}
  .sidebar{min-width:0}
}
</style>
</head>

// ============================================================
// GENERATION ENGINE
// ============================================================
function pick(arr, seed) {
  return arr[Math.abs(seed) % arr.length];
}

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0x7fffffff;
    return s / 0x7fffffff;
  };
}

function shuffleWithSeed(arr, seed) {
  const result = [...arr];
  const rng = seededRandom(seed);
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function inferCategory(product) {
  const lower = product.toLowerCase();
  const keywords = {
    'software': ['software', 'app', 'platform', 'tool', 'saas', 'dashboard'],
    'service': ['service', 'consulting', 'agency', 'management', 'support'],
    'courses': ['course', 'training', 'class', 'lesson', 'workshop', 'bootcamp'],
    'gear': ['shoe', 'wear', 'clothing', 'gear', 'equipment', 'apparel'],
    'food': ['food', 'meal', 'recipe', 'snack', 'drink', 'coffee', 'tea'],
    'fitness': ['fitness', 'gym', 'workout', 'exercise', 'health', 'wellness'],
    'finance': ['finance', 'banking', 'investment', 'insurance', 'credit', 'loan'],
    'hosting': ['hosting', 'cloud', 'server', 'infrastructure', 'deploy'],
    'marketing': ['marketing', 'seo', 'advertising', 'email', 'social media'],
    'design': ['design', 'creative', 'graphic', 'ui', 'ux', 'branding'],
  };
  for (const [cat, words] of Object.entries(keywords)) {
    if (words.some(w => lower.includes(w))) return cat;
  }
  return 'solution';
}

function fillTemplate(template, vars) {
  let result = template;
  for (const [key, value] of Object.entries(vars)) {
    result = result.replace(new RegExp('\\{' + key + '\\}', 'g'), value);
  }
  return result;
}

function truncateToLimit(text, limit) {
  if (text.length <= limit) return text;
  // Try to truncate at a word boundary
  let truncated = text.substring(0, limit);
  const lastSpace = truncated.lastIndexOf(' ');
  if (lastSpace > limit * 0.6) {
    truncated = truncated.substring(0, lastSpace);
  }
  // Remove trailing punctuation that looks incomplete
  truncated = truncated.replace(/[,;:\s]+$/, '');
  // Add period if missing
  if (!/[.!?]$/.test(truncated)) {
    if (truncated.length < limit) {
      truncated += '.';
    }
  }
  return truncated;
}

function applyTone(text, tone) {
  switch (tone) {
    case 'casual':
      return text.replace(/Discover /g, 'Check out ').replace(/utilizing/g, 'using').replace(/Furthermore/g, 'Plus');
    case 'urgent':
      return text.replace(/today\./gi, 'right now!').replace(/\. (?=[A-Z])/g, '! ');
    case 'playful':
      return text.replace(/Get /g, 'Grab ').replace(/amazing/g, 'awesome');
    case 'authoritative':
      return text.replace(/We think/g, 'The data shows').replace(/you might/g, 'you should');
    case 'emotional':
      return text.replace(/\bGet\b/g, 'Experience').replace(/\bUse\b/g, 'Embrace');
    default:
      return text;
  }
}

function generateVariantForAngle(angle, platform, vars, seed) {
  const rng = seededRandom(seed);
  const templates = TEMPLATES[angle.id];
  const platFields = PLATFORMS[platform].fields;
  const result = {};

  for (const field of platFields) {
    const limit = field.limit;
    let template;

    // Pick appropriate template type based on field characteristics
    if (limit <= 30) {
      // Short field = headline
      const headlinePool = shuffleWithSeed(templates.headlines, seed + field.key.length);
      template = headlinePool[0];
    } else if (limit <= 40) {
      // Medium-short = headline variant
      const headlinePool = shuffleWithSeed(templates.headlines, seed + field.key.length * 3);
      template = headlinePool[1 % headlinePool.length];
    } else if (limit >= 125) {
      // Long field = primary text
      const textPool = shuffleWithSeed(templates.primary_texts, seed + field.key.length * 2);
      template = textPool[0];
    } else {
      // Medium = description
      const descPool = shuffleWithSeed(templates.descriptions, seed + field.key.length * 5);
      template = descPool[0];
    }

    let text = fillTemplate(template, vars);
    text = applyTone(text, S.tone);
    text = truncateToLimit(text, limit);
    result[field.key] = text;
    seed += 7; // Advance seed for next field
  }

  return result;
}

function generate() {
  if (!S.brand.trim() || !S.product.trim()) return;

  S.seed = Date.now();
  generateWithSeed(S.seed);
}

function regenerate() {
  S.seed = Date.now();
  generateWithSeed(S.seed);
}

function generateWithSeed(baseSeed) {
  const brand = S.brand.trim();
  const product = S.product.trim();
  const category = inferCategory(product);

  S.variants = ANGLES.map((angle, i) => {
    const seed = baseSeed + i * 1337;
    const rng = seededRandom(seed);
    const rngIdx = () => Math.floor(rng() * 1000);

    const vars = {
      brand,
      product,
      category,
      cta: S.cta,
      benefit: pick(SMART_DATA.benefits, rngIdx()),
      benefit_sentence: pick(SMART_DATA.benefit_sentences, rngIdx()),
      benefit_verb: pick(SMART_DATA.verbs, rngIdx()).replace(/s$/, ''),
      pain_point: pick(SMART_DATA.pain_points, rngIdx()),
      pain_verb: pick(SMART_DATA.pain_verbs, rngIdx()),
      verb: pick(SMART_DATA.verbs, rngIdx()),
      audience: pick(SMART_DATA.audiences, rngIdx()),
      number: pick(SMART_DATA.numbers, rngIdx()),
      rating: pick(SMART_DATA.ratings, rngIdx()),
      offer: pick(SMART_DATA.offers, rngIdx()),
      offer_details: pick(SMART_DATA.offer_details, rngIdx()),
      time_limit: pick(SMART_DATA.time_limits, rngIdx()),
      hours: pick(SMART_DATA.hours, rngIdx()),
      cost: pick(SMART_DATA.costs, rngIdx()),
      aspiration: pick(SMART_DATA.aspirations, rngIdx()),
      aspiration_verb: pick(SMART_DATA.aspiration_verbs, rngIdx()),
      solves_it: pick(SMART_DATA.solves_it, rngIdx()),
      solves_it_sentence: pick(SMART_DATA.solves_it_sentences, rngIdx()),
      social_proof_sentence: pick(SMART_DATA.social_proof_sentences, rngIdx()),
    };

    const fields = generateVariantForAngle(angle, S.platform, vars, seed);
    return { angle, fields };
  });

  renderVariants();
}

// ============================================================
// RENDER VARIANTS
// ============================================================
function renderVariants() {
  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  const header = document.getElementById('mainHeader');
  const exportBar = document.getElementById('exportBar');
  const plat = PLATFORMS[S.platform];

  empty.style.display = 'none';
  grid.style.display = 'grid';
  header.style.display = 'flex';
  exportBar.style.display = 'flex';

  document.getElementById('resultsTitle').textContent = `${S.variants.length} variants for ${plat.name}`;
  document.getElementById('exportCount').textContent = `${S.variants.length} variants`;

  grid.innerHTML = S.variants.map((variant, vi) => {
    const angle = variant.angle;
    const fieldsHtml = plat.fields.map(f => {
      const text = variant.fields[f.key] || '';
      const len = text.length;
      const limit = f.limit;
      const pct = len / limit;
      const colorClass = pct > 1 ? 'char-red' : pct > 0.85 ? 'char-yellow' : 'char-green';
      return `
        <div class="ad-field">
          <div class="ad-field-label">
            <span>${f.label}</span>
            <span class="char-count ${colorClass}">${len} / ${limit}</span>
          </div>
          <div class="ad-field-text">${escHtml(text)}</div>
        </div>
      `;
    }).join('');

    return `
      <div class="ad-card" data-variant="${vi}">
        <div class="card-header">
          <div class="card-angle">
            <div class="card-angle-icon">${angle.icon}</div>
            ${angle.label}
          </div>

            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
        <div class="card-body">
          ${fieldsHtml}
        </div>
        <div class="card-footer">
          <div class="card-platform">${plat.icon} ${plat.name}</div>
          <span style="font-size:.62rem;color:var(--muted)">Variant ${vi + 1} of ${S.variants.length}</span>
        </div>
      </div>
    `;
  }).join('');

  // Bind copy buttons
  grid.querySelectorAll('[data-copy]').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const vi = +btn.dataset.copy;
      copyVariant(vi, btn);
    };
  });

  // Bind regenerate
  document.getElementById('btnRegenerate').onclick = regenerate;

  // Bind export buttons
  document.getElementById('btnCopyAll').onclick = copyAll;
  document.getElementById('btnExport').onclick = exportTxt;
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ============================================================
// COPY & EXPORT
// ============================================================
function variantToText(variant, index) {
  const plat = PLATFORMS[S.platform];
  const lines = [`--- Variant ${index + 1}: ${variant.angle.label} ---`];
  for (const f of plat.fields) {
    const text = variant.fields[f.key] || '';
    lines.push(`${f.label}: ${text}`);
  }
  return lines.join('\n');
}

function copyVariant(vi, btnEl) {
  const variant = S.variants[vi];
  const text = variantToText(variant, vi);
  navigator.clipboard.writeText(text).then(() => {
    btnEl.classList.add('copied');
    btnEl.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied`;
    setTimeout(() => {
      btnEl.classList.remove('copied');
      btnEl.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
    }, 2000);
  });
}

function copyAll() {
  const plat = PLATFORMS[S.platform];
  const header = `Ad Copy for ${S.brand} - ${S.product}\nPlatform: ${plat.name} | Tone: ${S.tone} | CTA: ${S.cta}\nGenerated: ${new Date().toLocaleDateString()}\n`;
  const body = S.variants.map((v, i) => variantToText(v, i)).join('\n\n');
  const fullText = header + '\n' + body;
  navigator.clipboard.writeText(fullText).then(() => {
    showToast('All variants copied to clipboard');
  });
}

function exportTxt() {
  const plat = PLATFORMS[S.platform];
  const header = `Ad Copy for ${S.brand} - ${S.product}\nPlatform: ${plat.name}\nTone: ${S.tone}\nCTA: ${S.cta}\nGenerated: ${new Date().toLocaleString()}\n${'='.repeat(50)}`;
  const body = S.variants.map((v, i) => {
    const lines = [`\n[Variant ${i + 1}: ${v.angle.label}]`];
    for (const f of plat.fields) {
      const text = v.fields[f.key] || '';
      lines.push(`${f.label} (${text.length}/${f.limit}): ${text}`);
    }
    return lines.join('\n');
  }).join('\n');
  const fullText = header + '\n' + body + '\n';

  const blob = new Blob([fullText], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${S.brand.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${S.platform}-ad-copy.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported as text file');
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
