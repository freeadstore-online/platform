<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Ad Preview - FreeAdStore</title>
<meta name="description" content="Preview shopping ads for Google Shopping, Meta Shopping, and Amazon. Compare products side-by-side, toggle mobile/desktop. Free, no signup.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--text:#1a1a1a;--muted:#6b7280;--accent:#ef4444;--accent-light:rgba(239,68,68,.08);--accent-hover:#dc2626;--panel:#ffffff;--line:#e5e7eb;--radius:10px;--green:#22c55e;--yellow:#eab308;--red:#ef4444}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a.back{display:inline-block;padding:14px 16px;color:var(--accent);text-decoration:none;font-weight:600;font-size:.85rem}
a.back:hover{text-decoration:underline}
a.back span{font-weight:400;color:var(--muted)}

.app{display:flex;height:100vh}
.sidebar{width:360px;min-width:360px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.sidebar-scroll{flex:1;overflow-y:auto;padding:0 20px 20px}
.sidebar-head{padding:16px 20px 0;flex-shrink:0}
.sidebar-head h1{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:700;margin-bottom:2px;color:var(--text)}
.sidebar-head p{font-size:.75rem;color:var(--muted);margin-bottom:14px;line-height:1.4}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
.main-header{padding:16px 24px 0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.main-header h2{font-size:.85rem;font-weight:700;color:var(--text)}
.main-scroll{flex:1;overflow-y:auto;padding:16px 24px 24px}

.panel{margin-bottom:16px}
.panel-title{font-size:.72rem;font-weight:700;color:var(--text);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
label{font-size:.7rem;color:var(--muted);display:block;margin:8px 0 4px;font-weight:500}
input[type=text],input[type=number],textarea,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:.85rem;font-family:inherit;background:var(--bg);outline:none;transition:border-color .15s}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:var(--accent)}
select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%236b7280' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}

.pill-row{display:flex;gap:5px;flex-wrap:wrap}
.pill{padding:5px 12px;border:1px solid var(--line);border-radius:8px;font-size:.72rem;font-weight:600;cursor:pointer;background:var(--panel);font-family:inherit;transition:all .12s;color:var(--text)}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.btn{padding:10px 20px;border-radius:var(--radius);font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(239,68,68,.3)}
.btn-primary:active{transform:translateY(0)}
.btn-outline{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:7px 14px;font-size:.75rem;font-weight:600}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 12px;font-size:.72rem}

input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;height:6px;-webkit-appearance:none;background:var(--line);border-radius:3px;outline:none;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}

.sep{height:1px;background:var(--line);margin:16px 0}

/* PRODUCT TABS */
.product-tabs{display:flex;gap:4px;margin-bottom:12px}
.product-tab{padding:6px 14px;border:1px solid var(--line);border-radius:8px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;background:var(--panel);color:var(--text);transition:all .12s}
.product-tab:hover{border-color:var(--accent);color:var(--accent)}
.product-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.product-tab.add{border-style:dashed;color:var(--muted)}
.product-tab.add:hover{border-color:var(--accent);color:var(--accent)}

/* STAR RATING */
.star-row{display:flex;gap:3px;align-items:center}
.star-row button{background:none;border:none;cursor:pointer;padding:2px;font-size:1.1rem;color:var(--line);transition:color .1s}
.star-row button.filled{color:#f59e0b}
.star-row span{font-size:.7rem;color:var(--muted);margin-left:4px}

/* UPLOAD AREA */
.upload-area{border:2px dashed var(--line);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:all .15s;font-size:.72rem;color:var(--muted);position:relative;overflow:hidden}
.upload-area:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.upload-area.has-img{border-style:solid;border-color:var(--green);padding:4px}
.upload-area img{width:100%;height:80px;object-fit:contain;border-radius:6px}

/* PREVIEW CARDS */
.preview-section{margin-bottom:24px}
.preview-section-title{font-size:.72rem;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.preview-section-title svg{width:16px;height:16px;opacity:.6}
.preview-grid{display:flex;gap:16px;flex-wrap:wrap}

/* GOOGLE SHOPPING CARD */
.gsc{width:220px;background:#fff;border:1px solid #dadce0;border-radius:8px;overflow:hidden;font-family:Arial,sans-serif;cursor:default;transition:box-shadow .2s}
.gsc:hover{box-shadow:0 1px 6px rgba(0,0,0,.1)}
.gsc-img{width:100%;height:220px;background:#f8f9fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gsc-img img{width:100%;height:100%;object-fit:contain;padding:12px}
.gsc-img .ph{color:#9aa0a6;font-size:.7rem}
.gsc-body{padding:12px}
.gsc-title{font-size:14px;color:#202124;line-height:1.3;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gsc-price{font-size:16px;font-weight:700;color:#202124;margin-bottom:2px}
.gsc-sale{display:flex;align-items:center;gap:8px}
.gsc-sale .orig{text-decoration:line-through;color:#70757a;font-size:13px;font-weight:400}
.gsc-sale .sale{color:#d93025}
.gsc-store{font-size:12px;color:#70757a;margin-bottom:4px}
.gsc-stars{display:flex;align-items:center;gap:2px;margin-bottom:4px}
.gsc-stars svg{width:12px;height:12px}
.gsc-stars span{font-size:11px;color:#70757a}
.gsc-badge{display:inline-block;font-size:11px;color:#188038;background:#e6f4ea;padding:2px 8px;border-radius:4px;font-weight:500;margin-top:4px}

/* META SHOPPING CARD */
.msc{width:280px;background:#fff;border:1px solid #dddfe2;border-radius:8px;overflow:hidden;font-family:Helvetica,Arial,sans-serif;cursor:default;transition:box-shadow .2s}
.msc:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.msc-img{width:100%;height:280px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;overflow:hidden}
.msc-img img{width:100%;height:100%;object-fit:cover}
.msc-img .ph{color:#8a8d91;font-size:.7rem}
.msc-body{padding:12px}
.msc-title{font-size:15px;font-weight:600;color:#050505;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msc-price{font-size:15px;font-weight:700;color:#050505;margin-bottom:2px}
.msc-sale .orig{text-decoration:line-through;color:#65676b;font-size:13px;font-weight:400;margin-left:8px}
.msc-brand{font-size:13px;color:#65676b;margin-bottom:8px}
.msc-cta{width:100%;padding:8px;border:none;border-radius:6px;background:#1877f2;color:#fff;font-size:14px;font-weight:600;cursor:default;font-family:inherit}

/* AMAZON-STYLE CARD */
.asc{width:240px;background:#fff;border:1px solid #d5d9d9;border-radius:8px;overflow:hidden;font-family:Arial,sans-serif;cursor:default;transition:box-shadow .2s}
.asc:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.asc-img{width:100%;height:240px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #d5d9d9}
.asc-img img{width:100%;height:100%;object-fit:contain;padding:16px}
.asc-img .ph{color:#888;font-size:.7rem}
.asc-body{padding:12px}
.asc-title{font-size:14px;color:#0f1111;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.asc-stars{display:flex;align-items:center;gap:2px;margin-bottom:4px}
.asc-stars svg{width:14px;height:14px}
.asc-stars span{font-size:12px;color:#007185;margin-left:4px}
.asc-price{margin-bottom:2px}
.asc-price .symbol{font-size:13px;vertical-align:top;color:#0f1111}
.asc-price .whole{font-size:22px;font-weight:700;color:#0f1111}
.asc-price .frac{font-size:13px;vertical-align:top;color:#0f1111}
.asc-sale .orig{text-decoration:line-through;color:#565959;font-size:12px;margin-left:8px}
.asc-ship{font-size:12px;color:#0f1111;margin-top:4px}
.asc-prime{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:#0f1111;margin-top:2px}
.asc-prime svg{width:14px;height:14px}

/* MOBILE TOGGLE */
.device-toggle{display:flex;gap:4px}
.device-toggle .pill{padding:4px 10px}

/* MOBILE WRAPPER */
.mobile-wrap{max-width:375px;margin:0 auto}
.mobile-wrap .preview-grid{flex-direction:column}
.mobile-wrap .gsc,.mobile-wrap .msc,.mobile-wrap .asc{width:100%}

/* COMPARISON VIEW */
.comparison-row{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:400px;text-align:center;padding:40px}
.empty-icon{width:80px;height:80px;border-radius:20px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.empty-icon svg{width:36px;height:36px;color:var(--accent)}
.empty-state h3{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700;margin-bottom:6px}
.empty-state p{font-size:.82rem;color:var(--muted);max-width:320px;line-height:1.5}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 20px;border-radius:10px;font-size:.78rem;font-weight:600;opacity:0;transition:all .3s ease;z-index:1000;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  .app{flex-direction:column;height:auto}
  .sidebar{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--line);max-height:none}
  .main{min-height:60vh}
  .preview-grid{flex-direction:column}
  .gsc,.msc,.asc{width:100%!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-head">
      <a class="back" href="/"><span>&larr;</span> FreeAdStore</a>
      <h1>Shopping Ad Preview</h1>
      <p>Preview how your products look on Google Shopping, Meta, and Amazon.</p>
    </div>
    <div class="sidebar-scroll" id="controls"></div>
  </div>
  <div class="main">
    <div class="main-header">
      <h2 id="resultsTitle">Shopping Previews</h2>
      <div class="device-toggle" id="deviceToggle">
        <button class="pill active" data-device="desktop">Desktop</button>
        <button class="pill" data-device="mobile">Mobile</button>
      </div>
    </div>
    <div class="main-scroll" id="mainContent">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </div>
        <h3>Ready to preview</h3>
        <p>Enter your product details in the sidebar, then click "Generate Previews" to see how they look across shopping platforms.</p>
      </div>
      <div id="previewArea" style="display:none"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
const SHIPPING_OPTIONS = ['Free Shipping','$4.99 shipping','$7.99 shipping','$9.99 shipping','Pickup available','2-day shipping'];

let S = {
  products: [
    {name:'',price:'',salePrice:'',store:'',rating:0,shipping:'Free Shipping',imgData:null}
  ],
  activeProduct: 0,
  device: 'desktop',
  showPreview: false,
};

function buildControls() {
  const c = document.getElementById('controls');
  const p = S.products[S.activeProduct];
  c.innerHTML = `
  <div class="panel">
    <div class="panel-title">Products</div>
    <div class="product-tabs" id="productTabs">
      ${S.products.map((pr, i) => `<button class="product-tab${i===S.activeProduct?' active':''}" data-idx="${i}">Product ${i+1}</button>`).join('')}
      ${S.products.length < 4 ? '<button class="product-tab add" id="btnAddProduct">+</button>' : ''}
    </div>
    ${S.products.length > 1 ? `<button class="btn-outline btn-sm" style="margin-bottom:8px;color:var(--red);border-color:var(--red)" id="btnRemoveProduct">Remove Product ${S.activeProduct+1}</button>` : ''}
  </div>

  <div class="panel">
    <div class="panel-title">Product Details</div>
    <label>Product Name</label>
    <input type="text" id="inpName" value="${esc(p.name)}" placeholder="e.g. Wireless Bluetooth Headphones">
    <label>Price ($)</label>
    <input type="number" id="inpPrice" value="${p.price}" placeholder="49.99" min="0" step="0.01">
    <label>Sale Price ($ optional)</label>
    <input type="number" id="inpSalePrice" value="${p.salePrice}" placeholder="Leave empty if no sale" min="0" step="0.01">
    <label>Store Name</label>
    <input type="text" id="inpStore" value="${esc(p.store)}" placeholder="e.g. acme.com">
  </div>

  <div class="panel">
    <div class="panel-title">Product Image</div>
    <div class="upload-area${p.imgData?' has-img':''}" id="uploadArea">
      ${p.imgData ? `<img src="${p.imgData}" alt="Product">` : 'Click to upload product image'}
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Rating</div>
    <div class="star-row" id="starRow">
      ${[1,2,3,4,5].map(n => `<button data-star="${n}" class="${n<=p.rating?'filled':''}" title="${n} star${n>1?'s':''}">&#9733;</button>`).join('')}
      <span id="ratingLabel">${p.rating > 0 ? p.rating + '/5' : 'No rating'}</span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Shipping</div>
    <select id="selShipping">
      ${SHIPPING_OPTIONS.map(s => `<option${s===p.shipping?' selected':''}>${s}</option>`).join('')}
    </select>
  </div>

  <div class="sep"></div>

  <button class="btn btn-primary" id="btnGenerate">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Generate Previews
  </button>
  `;
  bindControls();
}

function esc(s) { return (s||'').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function escHtml(s) { return (s||'').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function bindControls() {
  const $ = id => document.getElementById(id);
  const p = () => S.products[S.activeProduct];

  $('inpName').oninput = e => { p().name = e.target.value; if (S.showPreview) renderPreviews(); };
  $('inpPrice').oninput = e => { p().price = e.target.value; if (S.showPreview) renderPreviews(); };
  $('inpSalePrice').oninput = e => { p().salePrice = e.target.value; if (S.showPreview) renderPreviews(); };
  $('inpStore').oninput = e => { p().store = e.target.value; if (S.showPreview) renderPreviews(); };
  $('selShipping').onchange = e => { p().shipping = e.target.value; if (S.showPreview) renderPreviews(); };

  $('starRow').onclick = e => {
    const btn = e.target.closest('[data-star]');
    if (!btn) return;
    const val = +btn.dataset.star;
    p().rating = p().rating === val ? 0 : val;
    buildControls();
    if (S.showPreview) renderPreviews();
  };

  $('uploadArea').onclick = () => {
    const fi = $('fileInput');
    fi.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => { p().imgData = ev.target.result; buildControls(); if (S.showPreview) renderPreviews(); };
      reader.readAsDataURL(file);
      fi.value = '';
    };
    fi.click();
  };

  // Product tabs
  $('productTabs').onclick = e => {
    const tab = e.target.closest('[data-idx]');
    if (tab) { S.activeProduct = +tab.dataset.idx; buildControls(); return; }
  };
  const addBtn = $('btnAddProduct');
  if (addBtn) addBtn.onclick = () => {
    if (S.products.length >= 4) return;
    S.products.push({name:'',price:'',store:'',salePrice:'',rating:0,shipping:'Free Shipping',imgData:null});
    S.activeProduct = S.products.length - 1;
    buildControls();
  };
  const rmBtn = $('btnRemoveProduct');
  if (rmBtn) rmBtn.onclick = () => {
    S.products.splice(S.activeProduct, 1);
    S.activeProduct = Math.min(S.activeProduct, S.products.length - 1);
    buildControls();
    if (S.showPreview) renderPreviews();
  };

  // Device toggle
  $('deviceToggle').onclick = e => {
    const pill = e.target.closest('[data-device]');
    if (!pill) return;
    S.device = pill.dataset.device;
    document.querySelectorAll('#deviceToggle .pill').forEach(p => p.classList.toggle('active', p.dataset.device === S.device));
    if (S.showPreview) renderPreviews();
  };

  $('btnGenerate').onclick = () => { S.showPreview = true; renderPreviews(); };
}

function renderPreviews() {
  $('emptyState').style.display = 'none';
  const area = $('previewArea');
  area.style.display = 'block';

  const isMobile = S.device === 'mobile';
  const wrapClass = isMobile ? 'mobile-wrap' : '';
  const products = S.products;
  const multi = products.length > 1;

  document.getElementById('resultsTitle').textContent = multi ? `${products.length} Products - Shopping Preview` : 'Shopping Ad Preview';

  // Generate cards for each product
  const googleCards = products.map((p, i) => renderGoogleCard(p, i)).join('');
  const metaCards = products.map((p, i) => renderMetaCard(p, i)).join('');
  const amazonCards = products.map((p, i) => renderAmazonCard(p, i)).join('');

  area.innerHTML = `
    <div class="${wrapClass}">
      <div class="preview-section">
        <div class="preview-section-title">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google Shopping
        </div>
        <div class="preview-grid ${multi ? 'comparison-row' : ''}">${googleCards}</div>
      </div>

      <div class="preview-section">
        <div class="preview-section-title">
          <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Meta Shopping
        </div>
        <div class="preview-grid ${multi ? 'comparison-row' : ''}">${metaCards}</div>
      </div>

      <div class="preview-section">
        <div class="preview-section-title">
          <svg viewBox="0 0 24 24" fill="#FF9900"><path d="M13.985 22.528c-3.915 1.024-8.07-.118-10.856-3.104a12.086 12.086 0 0 1-.44-.5c-.262-.312-.05-.753.344-.664.395.089 1.003.211 1.578.29 3.728.512 7.636-.583 10.556-3.147.264-.232.577.135.367.407a13.04 13.04 0 0 1-1.55 1.7"/><path d="M15.818 21.064c.295-.378-.33-.89-1.238-1.01-.907-.12-1.7.099-1.995.477-.295.378.33.89 1.238 1.01.907.12 1.7-.099 1.995-.477z"/><path d="M20.5 12c0 4.694-3.806 8.5-8.5 8.5S3.5 16.694 3.5 12 7.306 3.5 12 3.5s8.5 3.806 8.5 8.5z" fill="none" stroke="#232F3E" stroke-width="0"/></svg>
          Amazon-Style Reference
        </div>
        <div class="preview-grid ${multi ? 'comparison-row' : ''}">${amazonCards}</div>
      </div>
    </div>
  `;

  function $(id) { return document.getElementById(id); }
}

function renderStars(rating, style) {
  if (rating <= 0) return '';
  const starColor = style === 'amazon' ? '#DE7921' : style === 'google' ? '#FBBC04' : '#F5B829';
  let html = '';
  for (let i = 1; i <= 5; i++) {
    const fill = i <= rating ? starColor : '#dadce0';
    html += `<svg viewBox="0 0 24 24" fill="${fill}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
  }
  return html;
}

function fmtPrice(val) {
  const n = parseFloat(val);
  if (isNaN(n)) return '$0.00';
  return '$' + n.toFixed(2);
}

function fmtPriceParts(val) {
  const n = parseFloat(val);
  if (isNaN(n)) return {symbol:'$',whole:'0',frac:'00'};
  const parts = n.toFixed(2).split('.');
  return {symbol:'$',whole:parts[0],frac:parts[1]};
}

function renderGoogleCard(p, idx) {
  const name = p.name || 'Product Name';
  const store = p.store || 'store.com';
  const hasSale = p.salePrice && parseFloat(p.salePrice) < parseFloat(p.price);
  const displayPrice = hasSale ? fmtPrice(p.salePrice) : fmtPrice(p.price);

  return `<div class="gsc">
    <div class="gsc-img">${p.imgData ? `<img src="${p.imgData}" alt="">` : `<div class="ph">Product Image</div>`}</div>
    <div class="gsc-body">
      <div class="gsc-title">${escHtml(name)}</div>
      <div class="gsc-price ${hasSale ? 'gsc-sale' : ''}">
        <span${hasSale?' class="sale"':''}>${displayPrice}</span>
        ${hasSale ? `<span class="orig">${fmtPrice(p.price)}</span>` : ''}
      </div>
      <div class="gsc-store">${escHtml(store)}</div>
      ${p.rating > 0 ? `<div class="gsc-stars">${renderStars(p.rating,'google')}<span>${p.rating}.0</span></div>` : ''}
      ${p.shipping === 'Free Shipping' ? '<div class="gsc-badge">Free shipping</div>' : ''}
    </div>
  </div>`;
}

function renderMetaCard(p, idx) {
  const name = p.name || 'Product Name';
  const store = p.store || 'Brand';
  const hasSale = p.salePrice && parseFloat(p.salePrice) < parseFloat(p.price);
  const displayPrice = hasSale ? fmtPrice(p.salePrice) : fmtPrice(p.price);

  return `<div class="msc">
    <div class="msc-img">${p.imgData ? `<img src="${p.imgData}" alt="">` : `<div class="ph">Product Image</div>`}</div>
    <div class="msc-body">
      <div class="msc-title">${escHtml(name)}</div>
      <div class="msc-price ${hasSale ? 'msc-sale' : ''}">
        ${displayPrice}
        ${hasSale ? `<span class="orig">${fmtPrice(p.price)}</span>` : ''}
      </div>
      <div class="msc-brand">${escHtml(store)}</div>
      <button class="msc-cta">Shop Now</button>
    </div>
  </div>`;
}

function renderAmazonCard(p, idx) {
  const name = p.name || 'Product Name';
  const hasSale = p.salePrice && parseFloat(p.salePrice) < parseFloat(p.price);
  const pp = fmtPriceParts(hasSale ? p.salePrice : p.price);

  return `<div class="asc">
    <div class="asc-img">${p.imgData ? `<img src="${p.imgData}" alt="">` : `<div class="ph">Product Image</div>`}</div>
    <div class="asc-body">
      <div class="asc-title">${escHtml(name)}</div>
      ${p.rating > 0 ? `<div class="asc-stars">${renderStars(p.rating,'amazon')}<span>${(1000+Math.floor(Math.random()*9000))}</span></div>` : ''}
      <div class="asc-price ${hasSale ? 'asc-sale' : ''}">
        <span class="symbol">${pp.symbol}</span><span class="whole">${pp.whole}</span><span class="frac">${pp.frac}</span>
        ${hasSale ? `<span class="orig">${fmtPrice(p.price)}</span>` : ''}
      </div>
      ${p.shipping === 'Free Shipping' ? `<div class="asc-prime"><svg viewBox="0 0 24 24" fill="#0574F7"><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5" fill="#00A8E1"/><path d="M12 2L2 7l10 5 10-5L12 2z" fill="#0574F7"/></svg> FREE Shipping</div>` : `<div class="asc-ship">${escHtml(p.shipping)}</div>`}
    </div>
  </div>`;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

buildControls();
</script>
</body>
</html>
