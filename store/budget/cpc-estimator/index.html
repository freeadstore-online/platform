<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPC/CPM/CPA Estimator - FreeAdStore</title>
<meta name="description" content="Estimate CPC, CPM, and CPA costs across Google, Meta, LinkedIn, TikTok & more. Real 2026 industry benchmarks, per-platform breakdowns, visual comparisons. Free, no signup.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--text:#1a1a1a;--muted:#6b7280;--accent:#ef4444;--accent-light:#fef2f2;--panel:#ffffff;--line:#e5e7eb;--radius:10px;--green:#22c55e;--blue:#3b82f6;--purple:#8b5cf6;--orange:#f97316;--cyan:#06b6d4;--pink:#ec4899;--yellow:#eab308;--teal:#14b8a6}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a.back{display:inline-block;padding:14px 16px;color:var(--accent);text-decoration:none;font-weight:500;font-size:.85rem}
a.back:hover{text-decoration:underline}

/* SPLIT LAYOUT */
.app{display:flex;height:100vh}
.sidebar{width:360px;min-width:360px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.sidebar-scroll{flex:1;overflow-y:auto;padding:0 16px 16px}
.sidebar-head{padding:16px 16px 0;flex-shrink:0}
.sidebar-head h1{font-size:1.25rem;font-weight:800;margin-bottom:2px;font-family:'Fraunces',serif}
.sidebar-head p{font-size:.75rem;color:var(--muted);margin-bottom:12px}
.main{flex:1;display:flex;flex-direction:column;overflow-y:auto;min-width:0;background:var(--bg);padding:0}

/* PANELS */
.panel{margin-bottom:14px}
.panel-title{font-size:.72rem;font-weight:700;color:var(--text);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.panel-title svg{width:14px;height:14px;color:var(--muted)}
label{font-size:.7rem;color:var(--muted);display:block;margin:6px 0 3px;font-weight:500}
select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:.85rem;font-family:inherit;background:var(--bg);outline:none;color:var(--text)}
select:focus{border-color:var(--accent)}

/* PILLS */
.pill-row{display:flex;gap:4px;flex-wrap:wrap}
.pill{padding:5px 12px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;font-weight:600;cursor:pointer;background:var(--panel);font-family:inherit;transition:all .12s;color:var(--text)}
.pill:hover{border-color:var(--accent)}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* CHECKBOXES */
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.check-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:.72rem;font-weight:500;transition:all .12s;user-select:none}
.check-item:hover{border-color:var(--accent)}
.check-item.active{border-color:var(--accent);background:var(--accent-light)}
.check-item .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* MAIN CONTENT */
.results{padding:24px;max-width:960px;margin:0 auto;width:100%}

/* BIG ESTIMATE CARD */
.estimate-card{background:linear-gradient(135deg,var(--accent),#dc2626);border-radius:14px;padding:32px;margin-bottom:20px;text-align:center;color:#fff}
.estimate-card .metric-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.85;margin-bottom:6px}
.estimate-card .range{font-size:2.6rem;font-weight:800;font-family:'Fraunces',serif;line-height:1.2}
.estimate-card .unit{font-size:.85rem;font-weight:500;opacity:.8;margin-top:4px}
.estimate-card .sub-metrics{display:flex;justify-content:center;gap:32px;margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.2)}
.estimate-card .sub-metric{text-align:center}
.estimate-card .sub-metric .val{font-size:1.3rem;font-weight:800;font-family:'Fraunces',serif}
.estimate-card .sub-metric .lbl{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;opacity:.7;margin-top:2px}

/* BREAKDOWN TABLE */
.breakdown{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;overflow-x:auto}
.breakdown h3{font-size:.82rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.breakdown table{width:100%;border-collapse:collapse;font-size:.78rem}
.breakdown th{text-align:left;font-size:.66rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--line)}
.breakdown td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.breakdown tr:last-child td{border-bottom:none}
.breakdown .platform-cell{display:flex;align-items:center;gap:8px;font-weight:600}
.breakdown .platform-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.6rem;font-weight:800;flex-shrink:0}
.breakdown .highlight{font-weight:700;color:var(--accent)}
.breakdown .note-cell{font-size:.7rem;color:var(--muted);max-width:140px}

/* CHART */
.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.chart-card h3{font-size:.82rem;font-weight:700;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{width:110px;font-size:.72rem;font-weight:600;text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:28px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width .4s ease;display:flex;align-items:center;padding:0 8px;min-width:fit-content}
.bar-fill span{font-size:.65rem;font-weight:700;color:#fff;white-space:nowrap}
.bar-value{width:80px;font-size:.72rem;font-weight:600;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}

/* COMPARE CARD */
.compare-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.compare-card h3{font-size:.82rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.compare-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.compare-label{width:120px;font-size:.72rem;font-weight:600;flex-shrink:0}
.compare-bar-wrap{flex:1;position:relative;height:24px}
.compare-bar{height:100%;border-radius:5px;transition:width .4s}
.compare-bar-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--bg);border-radius:5px}
.compare-value{width:70px;font-size:.75rem;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
.compare-value.accent{color:var(--accent)}

/* PROJECTION CARD */
.projection-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.projection-card h3{font-size:.82rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.projection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.proj-item{background:var(--bg);border-radius:10px;padding:14px;text-align:center}
.proj-item .proj-count{font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.proj-item .proj-range{font-size:1.1rem;font-weight:800;font-family:'Fraunces',serif;color:var(--text)}
.proj-item .proj-unit{font-size:.65rem;color:var(--muted);margin-top:2px}

/* TIPS */
.tips-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.tips-card h3{font-size:.82rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tip{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.78rem;line-height:1.5}
.tip:last-child{border-bottom:none}
.tip-icon{width:28px;height:28px;border-radius:6px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.75rem}

/* EXPORT ROW */
.export-row{display:flex;gap:8px;margin-bottom:20px}
.export-row .btn{width:auto;padding:8px 16px}
.btn{padding:9px 18px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .12s}
.btn-outline{background:var(--panel);color:var(--text);border:1px solid var(--line)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);text-align:center;gap:12px}
.empty-state svg{width:64px;height:64px;color:var(--line)}
.empty-state h2{font-size:1.1rem;font-weight:700;color:var(--text)}
.empty-state p{font-size:.82rem;max-width:360px}

/* PRINT STYLES */
@media print{
  .sidebar,.export-row,.back,a.back{display:none!important}
  .app{display:block}
  .main{overflow:visible}
  .results{padding:0;max-width:100%}
  .estimate-card,.breakdown,.chart-card,.compare-card,.projection-card,.tips-card{break-inside:avoid;border:1px solid #ddd;box-shadow:none}
  body{background:#fff}
  @page{margin:1.5cm}
}

/* RESPONSIVE */
@media(max-width:900px){
  .app{flex-direction:column;height:auto}
  .sidebar{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--line);max-height:50vh}
  .estimate-card .range{font-size:1.8rem}
  .estimate-card .sub-metrics{flex-wrap:wrap;gap:16px}
  .projection-grid{grid-template-columns:1fr}
  .check-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <!-- LEFT: Controls -->
  <div class="sidebar">
    <div class="sidebar-head">
      <a class="back" href="/">&#8592; FreeAdStore</a>

        <div class="pill-row" id="metricRow"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Results -->
  <div class="main">

</div>

<script>

const INDUSTRY_AVG_CPC = {

const INDUSTRY_TIPS = {

// Tips by platform
const PLATFORM_TIPS = {
  'google-search': 'Google Search captures the highest purchase intent. Use exact-match keywords and negative keyword lists to keep CPC efficient.',
  'google-display': 'Google Display delivers massive reach at low CPM. Use remarketing audiences and responsive display ads for best results.',

  youtube: 'YouTube pre-roll (skippable) has very low CPV. Aim for 15-30 second spots with a strong hook in the first 5 seconds.'
};

// ============================================================
// STATE
// ============================================================
let S = {
  platforms: new Set(['google-search', 'meta']),
  industry: 'technology',
  audience: 'medium',
  competition: 'medium',
  placement: 'standard',
  metric: 'cpc'
};

// ============================================================
// BUILD CONTROLS
// ============================================================
function buildControls() {
  // Platforms
  const grid = document.getElementById('platformGrid');
  grid.innerHTML = PLATFORMS.map(p => {
    const active = S.platforms.has(p.id);
    return `<div class="check-item${active ? ' active' : ''}" data-pid="${p.id}">
      <div class="dot" style="background:${p.color}"></div>
      <span>${p.name}</span>
    </div>`;
  }).join('');
  grid.onclick = e => {
    const el = e.target.closest('[data-pid]');
    if (!el) return;
    const pid = el.dataset.pid;
    if (S.platforms.has(pid)) S.platforms.delete(pid); else S.platforms.add(pid);
    el.classList.toggle('active', S.platforms.has(pid));
    render();
  };

  // Industry
  const sel = document.getElementById('industrySelect');
  sel.innerHTML = INDUSTRIES.map(i =>
    `<option value="${i.id}"${S.industry === i.id ? ' selected' : ''}>${i.name}</option>`
  ).join('');
  sel.onchange = e => { S.industry = e.target.value; render(); };

  // Audience pills
  buildPills('audienceRow', [
    { id: 'narrow', label: 'Narrow (<100K)' },
    { id: 'medium', label: 'Medium (100K-1M)' },
    { id: 'broad', label: 'Broad (1M+)' }
  ], 'audience');

  // Competition pills
  buildPills('competitionRow', [
    { id: 'low', label: 'Low' },
    { id: 'medium', label: 'Medium' },
    { id: 'high', label: 'High' }
  ], 'competition');

  // Placement pills
  buildPills('placementRow', [
    { id: 'premium', label: 'Premium' },
    { id: 'standard', label: 'Standard' },
    { id: 'all', label: 'All' }
  ], 'placement');

  // Metric pills
  buildPills('metricRow', [
    { id: 'cpc', label: 'CPC' },
    { id: 'cpm', label: 'CPM' },
    { id: 'cpa', label: 'CPA' }
  ], 'metric');
}

function buildPills(containerId, items, stateKey) {
  const row = document.getElementById(containerId);
  row.innerHTML = items.map(item =>
    `<button class="pill${S[stateKey] === item.id ? ' active' : ''}" data-val="${item.id}">${item.label}</button>`
  ).join('');
  row.onclick = e => {
    const el = e.target.closest('[data-val]');
    if (!el) return;
    S[stateKey] = el.dataset.val;
    row.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.val === S[stateKey]));
    render();
  };
}

// ============================================================
// CALCULATION
// ============================================================
function calcEstimates() {
  const mult = AUDIENCE_MULT[S.audience] * COMPETITION_MULT[S.competition] * PLACEMENT_MULT[S.placement];
  const selectedPlatforms = PLATFORMS.filter(p => S.platforms.has(p.id));

  return selectedPlatforms.map(p => {
    const baseCpc = CPC_DATA[p.id]?.[S.industry] || 1.00;
    const cpc = baseCpc * mult;
    const ctr = CTR_DATA[p.id] || 0.015;
    const cvr = CVR_DATA[p.id] || 0.015;

    // CPM = CPC * CTR * 1000
    const cpm = cpc * ctr * 1000;
    // CPA = CPC / CVR
    const cpa = cpc / cvr;

    // Range: -20% to +25%
    const cpcLow = cpc * 0.80;
    const cpcHigh = cpc * 1.25;
    const cpmLow = cpm * 0.80;
    const cpmHigh = cpm * 1.25;
    const cpaLow = cpa * 0.80;
    const cpaHigh = cpa * 1.25;

    return {
      ...p,
      cpc, cpcLow, cpcHigh,
      cpm, cpmLow, cpmHigh,
      cpa, cpaLow, cpaHigh,
      ctr, cvr,
      note: NOTES[p.id]
    };
  });
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const results = document.getElementById('results');
  const data = calcEstimates();

  if (data.length === 0) {
    results.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <h2>Select at least one platform</h2>
      <p>Check the platforms you want to compare, then adjust industry, audience, competition, and placement to see real-time cost estimates.</p>
    </div>`;
    return;
  }

  const metricLabel = { cpc: 'Cost Per Click', cpm: 'Cost Per 1,000 Impressions', cpa: 'Cost Per Acquisition' };
  const metricUnit = { cpc: 'per click', cpm: 'per 1,000 impressions', cpa: 'per acquisition' };
  const metricKey = S.metric;
  const metricKeyLow = metricKey + 'Low';
  const metricKeyHigh = metricKey + 'High';

  // Overall avg range across selected platforms
  const avgLow = data.reduce((s, d) => s + d[metricKeyLow], 0) / data.length;
  const avgHigh = data.reduce((s, d) => s + d[metricKeyHigh], 0) / data.length;
  const avgMid = data.reduce((s, d) => s + d[metricKey], 0) / data.length;

  // Other two metric averages for sub-display
  const otherMetrics = ['cpc','cpm','cpa'].filter(m => m !== metricKey);
  const subAvgs = otherMetrics.map(m => ({
    key: m.toUpperCase(),
    val: data.reduce((s, d) => s + d[m], 0) / data.length
  }));

  const fmt = n => {
    if (n >= 1000) return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    if (n >= 100) return '$' + n.toFixed(0);
    return '$' + n.toFixed(2);
  };
  const fmtFull = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pct = n => (n * 100).toFixed(1) + '%';

  // Industry avg for comparison
  const industryAvgCpc = INDUSTRY_AVG_CPC[S.industry] || 1.50;
  const mult = AUDIENCE_MULT[S.audience] * COMPETITION_MULT[S.competition] * PLACEMENT_MULT[S.placement];
  const adjustedIndustryAvg = industryAvgCpc * mult;

  // Bar chart: sort by primary metric descending
  const sorted = [...data].sort((a, b) => b[metricKey] - a[metricKey]);
  const maxVal = Math.max(...sorted.map(d => d[metricKey]));

  // Tips
  const tips = [];
  tips.push({ text: INDUSTRY_TIPS[S.industry] });
  data.forEach(d => {
    if (PLATFORM_TIPS[d.id]) tips.push({ text: PLATFORM_TIPS[d.id] });
  });
  if (S.audience === 'narrow') {
    tips.push({ text: 'Narrow audiences increase CPC by ~30%. If your budget is limited, consider broadening targeting and using platform algorithms to find converters.' });
  }
  if (S.competition === 'high' && S.placement === 'premium') {
    tips.push({ text: 'High competition + premium placement can increase costs by 2x or more. Consider testing standard placements first, then upgrading top performers.' });
  }
  if (data.some(d => d.id === 'linkedin') && S.industry !== 'b2b-saas' && S.industry !== 'technology') {
    tips.push({ text: 'LinkedIn is most cost-effective for B2B. For consumer-focused industries, Meta and TikTok typically deliver better ROI.' });
  }

  results.innerHTML = `
    <!-- Export -->
    <div class="export-row">
      <button class="btn btn-outline" id="btnPrint">Export as PDF</button>
    </div>

    <!-- Big Estimate Card -->
    <div class="estimate-card">
      <div class="metric-label">${metricLabel[metricKey]} (Avg. across ${data.length} platform${data.length > 1 ? 's' : ''})</div>
      <div class="range">${fmt(avgLow)} - ${fmt(avgHigh)}</div>
      <div class="unit">${metricUnit[metricKey]}</div>
      <div class="sub-metrics">
        ${subAvgs.map(s => `<div class="sub-metric">
          <div class="val">${fmt(s.val)}</div>
          <div class="lbl">Avg. ${s.key}</div>
        </div>`).join('')}
        <div class="sub-metric">
          <div class="val">${pct(data.reduce((s,d) => s + d.ctr, 0) / data.length)}</div>
          <div class="lbl">Avg. CTR</div>
        </div>
      </div>
    </div>

    <!-- Per-Platform Breakdown -->
    <div class="breakdown">
      <h3><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M6 20V4M18 20v-6"/></svg> Per-Platform Breakdown</h3>
      <table>
        <thead>
          <tr>
            <th>Platform</th>
            <th>Est. CPC</th>
            <th>Est. CPM</th>
            <th>Est. CPA</th>
            <th>CTR</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(d => `<tr>
            <td>
              <div class="platform-cell">
                <div class="platform-icon" style="background:${d.color}">${d.abbr}</div>
                ${d.name}
              </div>
            </td>
            <td class="${metricKey === 'cpc' ? 'highlight' : ''}">${fmtFull(d.cpc)}</td>
            <td class="${metricKey === 'cpm' ? 'highlight' : ''}">${fmtFull(d.cpm)}</td>
            <td class="${metricKey === 'cpa' ? 'highlight' : ''}">${fmtFull(d.cpa)}</td>
            <td>${pct(d.ctr)}</td>
            <td class="note-cell">${d.note}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <!-- Visual Comparison (bar chart) -->
    <div class="chart-card">
      <h3>${metricKey.toUpperCase()} by Platform</h3>
      ${sorted.map(d => {
        const barWidth = Math.max(6, (d[metricKey] / maxVal) * 100);
        return `<div class="bar-row">
          <div class="bar-label">${d.name}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${barWidth}%;background:${d.color}">
              <span>${fmtFull(d[metricKey])}</span>
            </div>
          </div>
          <div class="bar-value">${fmtFull(d[metricKey])}</div>
        </div>`;
      }).join('')}
    </div>

    <!-- How This Compares -->
    <div class="compare-card">
      <h3><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg> How This Compares</h3>
      ${(() => {
        const yourAvg = data.reduce((s,d) => s + d.cpc, 0) / data.length;
        const indAvg = adjustedIndustryAvg;
        const maxBar = Math.max(yourAvg, indAvg);
        const diff = ((yourAvg - indAvg) / indAvg * 100).toFixed(0);
        const diffLabel = yourAvg > indAvg
          ? diff + '% above industry average'
          : Math.abs(diff) + '% below industry average';
        const diffColor = yourAvg > indAvg ? 'var(--accent)' : 'var(--green)';
        return `
        <div class="compare-row">
          <div class="compare-label">Your Estimate</div>
          <div class="compare-bar-wrap">
            <div class="compare-bar-bg"></div>
            <div class="compare-bar" style="width:${(yourAvg/maxBar)*100}%;background:var(--accent)"></div>
          </div>
          <div class="compare-value accent">${fmtFull(yourAvg)}</div>
        </div>
        <div class="compare-row">
          <div class="compare-label">Industry Avg CPC</div>
          <div class="compare-bar-wrap">
            <div class="compare-bar-bg"></div>
            <div class="compare-bar" style="width:${(indAvg/maxBar)*100}%;background:var(--blue)"></div>
          </div>
          <div class="compare-value">${fmtFull(indAvg)}</div>
        </div>
        <div style="font-size:.75rem;color:${diffColor};font-weight:600;margin-top:6px;margin-left:132px">${diffLabel}</div>`;
      })()}
    </div>

    <!-- Cost Projection -->
    <div class="projection-card">
      <h3><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a4 4 0 0 0-8 0v2"/></svg> Cost Projection</h3>
      <div class="projection-grid">
        ${[
          { count: 1000, label: '1,000' },
          { count: 5000, label: '5,000' },
          { count: 10000, label: '10,000' }
        ].map(tier => {
          let low, high, unit;
          if (metricKey === 'cpc') {
            low = avgLow * tier.count; high = avgHigh * tier.count;
            unit = 'for ' + tier.label + ' clicks';
          } else if (metricKey === 'cpm') {
            low = avgLow * tier.count / 1000; high = avgHigh * tier.count / 1000;
            unit = 'for ' + tier.label + ' impressions';
          } else {
            low = avgLow * tier.count; high = avgHigh * tier.count;
            unit = 'for ' + tier.label + ' acquisitions';
          }
          return `<div class="proj-item">
            <div class="proj-count">${tier.label} ${metricKey === 'cpm' ? 'impressions' : metricKey === 'cpc' ? 'clicks' : 'acquisitions'}</div>
            <div class="proj-range">${fmt(low)} - ${fmt(high)}</div>
            <div class="proj-unit">estimated spend</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Tips -->
    <div class="tips-card">
      <h3><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> Tips &amp; Insights</h3>
      ${tips.map(t => `<div class="tip">
        <div class="tip-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg></div>
        <div>${t.text}</div>
      </div>`).join('')}
    </div>
  `;

  document.getElementById('btnPrint').onclick = () => window.print();
}

// ============================================================
// INIT
// ============================================================
buildControls();
render();
</script>
</body>
</html>
