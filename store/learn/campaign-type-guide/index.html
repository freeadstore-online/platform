<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Campaign Type Guide — FreeAdStore</title>
<meta name="description" content="Which ad campaign do you need? Interactive decision tree to find the right campaign type for your goal across Meta, Google, LinkedIn, TikTok, and YouTube. Free, no signup.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#ef4444;--accent-hover:#dc2626;--accent-light:#fef2f2;--bg:#fafafa;--text:#1a1a1a;--muted:#6b7280;--panel:#ffffff;--line:#e5e7eb;--green:#16a34a;--yellow:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;--cyan:#06b6d4;--pink:#ec4899;--orange:#f97316}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

.top-bar{padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
a.back{color:var(--accent);text-decoration:none;font-weight:500;font-size:.85rem}
a.back:hover{text-decoration:underline}

.hero{text-align:center;padding:2.5rem 1.5rem 1.5rem;max-width:800px;margin:0 auto}
.hero h1{font-family:'Fraunces',serif;font-size:2rem;font-weight:800;margin-bottom:.4rem}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-size:.88rem;max-width:560px;margin:0 auto;line-height:1.55}

.container{max-width:1100px;margin:0 auto;padding:0 24px 3rem}

/* Decision tree */
.question-section{text-align:center;padding:2rem 0 1.5rem}
.question{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:700;margin-bottom:1.25rem}
.goal-grid{display:flex;flex-wrap:wrap;gap:.65rem;justify-content:center;max-width:700px;margin:0 auto}
.goal-card{padding:1rem 1.5rem;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel);transition:all .2s;min-width:140px;text-align:center}
.goal-card:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.goal-card.selected{border-color:var(--accent);background:var(--accent-light)}
.goal-card .goal-icon{font-size:1.5rem;margin-bottom:.3rem}
.goal-card .goal-label{font-size:.82rem;font-weight:700}
.goal-card .goal-desc{font-size:.65rem;color:var(--muted);margin-top:.15rem;line-height:1.3}

.reset-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.4rem .85rem;border:1px solid var(--line);border-radius:99px;font-size:.72rem;font-weight:600;cursor:pointer;background:var(--panel);color:var(--muted);font-family:inherit;margin-top:1rem;transition:all .15s}
.reset-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Results */
.results-section{margin-top:1rem}
.results-header{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;margin-bottom:.4rem;text-align:center}
.results-subheader{font-size:.82rem;color:var(--muted);text-align:center;margin-bottom:1.5rem}

.campaign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}

.campaign-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.campaign-card:hover{border-color:#d1d5db;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.campaign-card-top{padding:3px 0 0;border-radius:12px 12px 0 0}
.campaign-card-body{padding:1rem 1.1rem}
.campaign-platform{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:4px;color:#fff;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.5rem}
.campaign-name{font-family:'Fraunces',serif;font-size:1rem;font-weight:700;margin-bottom:.35rem}
.campaign-desc{font-size:.75rem;color:var(--muted);line-height:1.5;margin-bottom:.75rem}

.campaign-specs{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.65rem}
.spec-item{background:var(--bg);padding:.45rem .65rem;border-radius:6px;border:1px solid var(--line)}
.spec-item .spec-label{font-size:.6rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:.1rem}
.spec-item .spec-value{font-size:.78rem;font-weight:700}

.campaign-tips{list-style:none;padding:0;margin-top:.5rem;border-top:1px solid var(--line);padding-top:.5rem}
.campaign-tips li{display:flex;align-items:flex-start;gap:.4rem;font-size:.72rem;line-height:1.45;padding:.25rem 0}
.campaign-tips li .tip-dot{color:var(--accent);font-weight:700;flex-shrink:0;font-size:.65rem;margin-top:2px}

/* Platform color map */
.plat-meta{background:#1877f2}
.plat-google{background:#4285f4}
.plat-linkedin{background:#0a66c2}
.plat-tiktok{background:#000000}
.plat-youtube{background:#ff0000}
.plat-pinterest{background:#e60023}
.plat-amazon{background:#ff9900}

.hidden{display:none}

footer{border-top:1px solid var(--line);padding:1rem;text-align:center;font-size:.7rem;color:var(--muted);background:var(--panel);margin-top:2rem}
footer a{color:var(--accent)}

@media(max-width:700px){
  .hero h1{font-size:1.5rem}
  .question{font-size:1.1rem}
  .campaign-grid{grid-template-columns:1fr}
  .goal-grid{flex-direction:column;align-items:center}
  .goal-card{min-width:200px}
}
</style>
</head>
<body>

<div class="top-bar">
  <a class="back" href="/">&larr; FreeAdStore</a>
</div>

<section class="hero">
  <h1>Campaign Type <span>Guide</span></h1>
  <p>Which campaign do you need? Answer one question and get platform-specific recommendations with budgets, timelines, and tips.</p>
</section>

<div class="container">
  <div class="question-section" id="questionSection">
    <div class="question">What is your primary goal?</div>
    <div class="goal-grid" id="goalGrid"></div>
    <button class="reset-btn hidden" id="resetBtn" onclick="resetSelection()">&#8634; Start Over</button>
  </div>

  <div class="results-section hidden" id="resultsSection">
    <div class="results-header" id="resultsHeader"></div>
    <div class="results-subheader" id="resultsSubheader"></div>
    <div class="campaign-grid" id="campaignGrid"></div>
  </div>
</div>

<footer>
  <a href="/">FreeAdStore</a> &mdash; Free advertising tools. No signup, no tracking.
</footer>

<script>
const GOALS = [
  {id:'awareness', label:'Brand Awareness', desc:'Get your name in front of new audiences', icon:'&#128226;'},
  {id:'traffic', label:'Website Traffic', desc:'Drive visitors to your site or landing page', icon:'&#128640;'},
  {id:'leads', label:'Lead Generation', desc:'Capture emails, phone numbers, or form fills', icon:'&#127919;'},
  {id:'sales', label:'Sales / Conversions', desc:'Drive purchases, signups, or bookings', icon:'&#128176;'},
  {id:'installs', label:'App Installs', desc:'Get users to download your mobile app', icon:'&#128241;'}
];

const CAMPAIGNS = {
  awareness: [
    {
      platform:'Meta', platClass:'plat-meta',
      name:'Brand Awareness Campaign',
      desc:'Optimized for ad recall lift. Meta shows your ad to people most likely to remember it. Ideal for launching a new brand or product line.',
      results:'2-5x ad recall lift vs. standard reach',
      budget:'$20-100/day minimum',
      timeline:'4-8 weeks for measurable lift',
      tips:['Use video creative (15-30s) for highest recall','Target broad interests -- let Meta optimize for recall','Measure with Brand Lift Study (available at $30K+ spend)']
    },
    {
      platform:'Meta', platClass:'plat-meta',
      name:'Reach Campaign',
      desc:'Maximize unique impressions within your target audience. Best when you need to reach the most people possible at the lowest cost per 1,000 impressions.',
      results:'$2-8 CPM depending on audience',
      budget:'$10-50/day minimum',
      timeline:'1-4 weeks',
      tips:['Set frequency cap (1-2x/week) to avoid ad fatigue','Combine with retargeting campaigns for full-funnel','Great for local businesses with geographic targeting']
    },
    {
      platform:'YouTube', platClass:'plat-youtube',
      name:'TrueView for Reach',
      desc:'Non-skippable bumper ads (6s) or skippable in-stream ads shown before YouTube videos. Massive reach at low CPMs.',
      results:'$4-10 CPM, 50-80% view rate',
      budget:'$25-100/day minimum',
      timeline:'2-6 weeks',
      tips:['Hook in the first 2 seconds -- brand name visible immediately','Bumper ads (6s) are non-skippable and great for brand lifts','Combine bumper + skippable in-stream for frequency + depth']
    },
    {
      platform:'Google', platClass:'plat-google',
      name:'Display Campaign',
      desc:'Banner ads across Google\'s Display Network (2M+ websites). Best for visual brand presence and retargeting.',
      results:'$1-5 CPM, 0.05-0.2% CTR',
      budget:'$15-75/day minimum',
      timeline:'2-8 weeks',
      tips:['Use responsive display ads -- Google auto-optimizes creative combinations','Exclude low-quality placements (games, parked domains)','Layer audience targeting (in-market + affinity) for relevance']
    },
    {
      platform:'TikTok', platClass:'plat-tiktok',
      name:'TopView / Brand Takeover',
      desc:'Premium full-screen placement. First ad users see when opening TikTok. Maximum impact for major launches.',
      results:'67% higher engagement than standard in-feed',
      budget:'$50,000+ (premium placement)',
      timeline:'1-3 days (event-based)',
      tips:['Reserve for product launches, events, or seasonal moments','Create native-looking vertical video content','Pair with a Branded Hashtag Challenge for amplification']
    },
    {
      platform:'LinkedIn', platClass:'plat-linkedin',
      name:'Sponsored Content (Awareness)',
      desc:'Native feed ads targeting professionals by job title, company, industry, and seniority. Best B2B awareness channel.',
      results:'$6-15 CPM, 0.4-0.6% CTR',
      budget:'$25-100/day minimum',
      timeline:'4-12 weeks',
      tips:['Lead with data or industry insights -- B2B audiences respond to numbers','Use carousel format for thought leadership content','Target by job function + seniority for precise reach']
    }
  ],
  traffic: [
    {
      platform:'Google', platClass:'plat-google',
      name:'Search Campaign (Traffic)',
      desc:'Text ads on Google Search results. Capture high-intent traffic from people actively searching for your product or service.',
      results:'2-5% CTR, $0.50-$5.00 CPC',
      budget:'$20-200/day depending on competition',
      timeline:'Immediate results, optimize over 2-4 weeks',
      tips:['Use exact and phrase match keywords for precision','Write 15 headlines + 4 descriptions for Responsive Search Ads','Add sitelink, callout, and structured snippet extensions']
    },
    {
      platform:'Meta', platClass:'plat-meta',
      name:'Traffic Campaign',
      desc:'Optimized for link clicks or landing page views. Meta shows ads to people most likely to click through to your site.',
      results:'$0.30-$2.00 CPC',
      budget:'$10-50/day minimum',
      timeline:'1-2 weeks to optimize',
      tips:['Optimize for Landing Page Views (not Link Clicks) to filter bots','Use carousel ads to show multiple pages or products','Retarget website visitors within 7 days for highest conversion']
    },
    {
      platform:'LinkedIn', platClass:'plat-linkedin',
      name:'Sponsored Content (Traffic)',
      desc:'Drive B2B professionals to your website, blog, or content hub. Higher CPC than other platforms but much higher lead quality.',
      results:'$3-8 CPC, 0.4-0.6% CTR',
      budget:'$30-150/day minimum',
      timeline:'2-4 weeks',
      tips:['Gate valuable content (whitepapers, reports) to capture leads simultaneously','Single image ads outperform video for traffic objectives','Target by company size + industry for qualified visitors']
    },
    {
      platform:'Pinterest', platClass:'plat-pinterest',
      name:'Traffic Pin Campaign',
      desc:'Promoted pins that drive clicks to your website. Long content half-life -- pins keep driving traffic for months after the campaign ends.',
      results:'$0.10-$1.50 CPC',
      budget:'$5-30/day minimum',
      timeline:'2-8 weeks (traffic continues after)',
      tips:['Use 2:3 vertical pins for maximum feed presence','Add keyword targeting -- Pinterest is a visual search engine','Seasonal content performs best when promoted 45 days early']
    }
  ],
  leads: [
    {
      platform:'Meta', platClass:'plat-meta',
      name:'Lead Ads (Instant Form)',
      desc:'In-app forms pre-filled with user data. No landing page needed -- users submit their info without leaving Facebook/Instagram.',
      results:'$2-15 per lead depending on industry',
      budget:'$20-100/day minimum',
      timeline:'1-2 weeks to optimize',
      tips:['Use "Higher Intent" form type for better quality leads (adds a confirmation step)','Keep forms short: name, email, phone max','Connect to CRM via Zapier for instant follow-up -- speed-to-lead matters']
    },
    {
      platform:'LinkedIn', platClass:'plat-linkedin',
      name:'Lead Gen Forms',
      desc:'LinkedIn\'s native lead capture with pre-filled professional data (job title, company, email). Highest B2B lead quality of any platform.',
      results:'$15-50 per lead (B2B)',
      budget:'$50-200/day minimum',
      timeline:'2-4 weeks',
      tips:['Offer high-value gated content (industry reports, ROI calculators)','Pre-fill fields reduce friction -- keep form to 3-4 fields','Follow up within 24 hours -- B2B lead response time is critical']
    },
    {
      platform:'Google', platClass:'plat-google',
      name:'Search Campaign (Lead Gen)',
      desc:'Capture high-intent leads searching for your solution. Use lead form extensions or drive to a landing page with a form.',
      results:'$5-50 per lead depending on industry',
      budget:'$30-200/day minimum',
      timeline:'Immediate, optimize over 2-4 weeks',
      tips:['Use lead form extensions for quick capture without leaving SERP','Target competitor brand keywords for conquest leads','Implement offline conversion tracking to measure lead quality']
    },
    {
      platform:'Meta', platClass:'plat-meta',
      name:'Conversion Campaign (Landing Page)',
      desc:'Drive traffic to a dedicated landing page with a form. Better for complex products that need explanation before lead capture.',
      results:'$5-30 per lead',
      budget:'$20-100/day minimum',
      timeline:'2-4 weeks to optimize',
      tips:['Landing page must load in <3 seconds and match ad messaging exactly','Use the Conversions API (not just Pixel) for accurate tracking','Test landing page vs. Lead Ad -- some audiences prefer one or the other']
    }
  ],
  sales: [
    {
      platform:'Google', platClass:'plat-google',
      name:'Shopping Campaign',
      desc:'Product listing ads with image, price, and reviews directly in Google Search. Highest purchase intent of any ad format.',
      results:'3-5% CTR, 2-4x ROAS typical',
      budget:'$20-500/day depending on catalog size',
      timeline:'1-2 weeks to stabilize',
      tips:['Optimize product titles: Brand + Product Type + Key Attribute in first 70 chars','Use Performance Max for automated bidding across all Google surfaces','Segment campaigns by product margin to set different ROAS targets']
    },
    {
      platform:'Meta', platClass:'plat-meta',
      name:'Conversions Campaign (Purchase)',
      desc:'Optimized for purchases using Meta Pixel and Conversions API. Meta shows ads to people most likely to buy based on behavioral signals.',
      results:'2-5x ROAS typical for established accounts',
      budget:'$30-200/day minimum',
      timeline:'2-4 weeks (needs 50 conversions/week for optimization)',
      tips:['Need 50 purchase events per week per ad set for stable optimization','Use Advantage+ Shopping Campaigns for automated audience + creative selection','Dynamic Product Ads retarget cart abandoners with their exact products']
    },
    {
      platform:'Google', platClass:'plat-google',
      name:'Dynamic Remarketing',
      desc:'Show previous visitors the exact products they viewed or added to cart. Highest conversion rates in Google Ads.',
      results:'5-10x ROAS, 1-3% conversion rate',
      budget:'$10-100/day (scales with traffic)',
      timeline:'Immediate (requires existing site traffic)',
      tips:['Segment by recency: 1-3 day visitors convert 3x better than 14-30 day','Show cart abandoners the products they left behind with a time-limited offer','Exclude recent purchasers (7-14 days) to avoid annoying existing customers']
    },
    {
      platform:'Meta', platClass:'plat-meta',
      name:'Advantage+ Shopping Campaign',
      desc:'Meta\'s AI-powered campaign that automates audience targeting, creative selection, and budget allocation across all placements.',
      results:'3-7x ROAS for e-commerce',
      budget:'$50-500/day minimum',
      timeline:'1-2 weeks to optimize',
      tips:['Upload 10+ creative variations -- Meta\'s AI tests them automatically','Set a cost per result goal rather than a daily budget for better ROAS control','Works best with broad catalogs (50+ products) and established Pixel data']
    },
    {
      platform:'Amazon', platClass:'plat-amazon',
      name:'Sponsored Products',
      desc:'Product ads in Amazon search results. Highest purchase intent in advertising -- users are already on Amazon ready to buy.',
      results:'8-15% conversion rate, 3-8x ROAS',
      budget:'$15-200/day per product',
      timeline:'Immediate, optimize keywords over 2 weeks',
      tips:['Your product listing IS the ad -- optimize images, title, and bullets first','Target competitor ASINs with product targeting for conquest sales','Start with auto campaigns to discover keywords, then graduate to manual']
    }
  ],
  installs: [
    {
      platform:'Google', platClass:'plat-google',
      name:'App Campaign',
      desc:'Automated ads across Google Search, Play Store, YouTube, and Display Network. Google generates ads from your app listing.',
      results:'$1-5 CPI (cost per install)',
      budget:'$20-200/day minimum',
      timeline:'1-2 weeks to optimize',
      tips:['Optimize your Play Store / App Store listing first -- it IS your ad creative','Provide 5+ text ideas, 20+ image assets, and 5+ video assets','Set a target CPI or target CPA for in-app actions (registration, purchase)']
    },
    {
      platform:'Meta', platClass:'plat-meta',
      name:'App Install Campaign',
      desc:'Drive app installs from Facebook and Instagram. Deep integration with app events for optimizing toward valuable users, not just installs.',
      results:'$1-4 CPI',
      budget:'$20-100/day minimum',
      timeline:'1-2 weeks to optimize',
      tips:['Optimize for app events (registration, purchase) not just installs for better quality','Use App Event Optimization to target users likely to take in-app actions','Video creative showing the app in action converts 30% better than static']
    },
    {
      platform:'TikTok', platClass:'plat-tiktok',
      name:'App Install Campaign',
      desc:'In-feed ads with direct app install CTA. TikTok\'s young, engaged audience is highly receptive to app discovery.',
      results:'$1-3 CPI',
      budget:'$20-100/day minimum',
      timeline:'1-2 weeks',
      tips:['Create native TikTok-style content showing the app in use','Use Spark Ads to boost organic content that naturally features your app','Target by interest categories rather than demographics for better results']
    },
    {
      platform:'Apple', platClass:'plat-google',
      name:'Apple Search Ads',
      desc:'Ads at the top of App Store search results. Users searching the App Store have the highest install intent of any channel.',
      results:'50%+ tap-to-install rate, $1-3 CPI',
      budget:'$10-100/day minimum',
      timeline:'Immediate results',
      tips:['Bid on your own brand name -- competitors will if you do not','Target competitor app names for conquest installs','Use Search Match (auto) to discover new keywords, then move winners to exact match']
    }
  ]
};

let selectedGoal = null;

function renderGoals(){
  const grid = document.getElementById('goalGrid');
  grid.innerHTML = GOALS.map(g =>
    `<div class="goal-card${selectedGoal === g.id ? ' selected' : ''}" data-id="${g.id}">
      <div class="goal-icon">${g.icon}</div>
      <div class="goal-label">${g.label}</div>
      <div class="goal-desc">${g.desc}</div>
    </div>`
  ).join('');

  grid.querySelectorAll('.goal-card').forEach(card => {
    card.addEventListener('click', () => {
      selectedGoal = card.dataset.id;
      renderGoals();
      showResults();
    });
  });
}

function showResults(){
  const campaigns = CAMPAIGNS[selectedGoal];
  if(!campaigns) return;

  const goal = GOALS.find(g => g.id === selectedGoal);

  document.getElementById('resultsSection').classList.remove('hidden');
  document.getElementById('resetBtn').classList.remove('hidden');
  document.getElementById('resultsHeader').textContent = 'Recommended Campaigns for ' + goal.label;
  document.getElementById('resultsSubheader').textContent = campaigns.length + ' campaign types across ' + [...new Set(campaigns.map(c => c.platform))].length + ' platforms';

  const grid = document.getElementById('campaignGrid');
  grid.innerHTML = campaigns.map(c => `
    <div class="campaign-card">
      <div class="campaign-card-top" style="background:var(--line);height:3px">
        <div style="height:3px;border-radius:3px 3px 0 0" class="${c.platClass}"></div>
      </div>
      <div class="campaign-card-body">
        <span class="campaign-platform ${c.platClass}">${c.platform}</span>
        <div class="campaign-name">${c.name}</div>
        <div class="campaign-desc">${c.desc}</div>
        <div class="campaign-specs">
          <div class="spec-item">
            <div class="spec-label">Expected Results</div>
            <div class="spec-value">${c.results}</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Recommended Budget</div>
            <div class="spec-value">${c.budget}</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Timeline</div>
            <div class="spec-value">${c.timeline}</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Difficulty</div>
            <div class="spec-value">${getDifficulty(c)}</div>
          </div>
        </div>
        <ul class="campaign-tips">
          ${c.tips.map(tip => `<li><span class="tip-dot">&#9654;</span>${tip}</li>`).join('')}
        </ul>
      </div>
    </div>
  `).join('');

  document.getElementById('resultsSection').scrollIntoView({behavior:'smooth', block:'start'});
}

function getDifficulty(campaign){
  const name = campaign.name.toLowerCase();
  if(name.includes('advantage+') || name.includes('performance max') || name.includes('app campaign')) return 'Easy (automated)';
  if(name.includes('topview') || name.includes('takeover') || name.includes('hashtag')) return 'Advanced';
  if(name.includes('remarketing') || name.includes('dynamic')) return 'Intermediate';
  if(name.includes('search')) return 'Intermediate';
  return 'Beginner-friendly';
}

window.resetSelection = function(){
  selectedGoal = null;
  document.getElementById('resultsSection').classList.add('hidden');
  document.getElementById('resetBtn').classList.add('hidden');
  renderGoals();
  window.scrollTo({top:0, behavior:'smooth'});
};

renderGoals();
</script>
</body>
</html>
