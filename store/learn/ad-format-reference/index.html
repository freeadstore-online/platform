<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Format Reference - FreeAdStore</title>
<meta name="description" content="Every ad format, every platform. Dimensions, character limits, file sizes. Google, Meta, LinkedIn, TikTok, X, YouTube, Amazon, Pinterest specs.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--text:#1a1a1a;--muted:#6b7280;--accent:#ef4444;--accent-light:#fef2f2;--panel:#ffffff;--line:#e5e7eb;--radius:10px;--green:#22c55e;--blue:#3b82f6;--purple:#8b5cf6;--orange:#f97316;--cyan:#06b6d4;--pink:#ec4899;--yellow:#eab308;--teal:#14b8a6}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

/* HEADER */
.top-bar{padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
a.back{color:var(--accent);text-decoration:none;font-weight:500;font-size:.85rem}
a.back:hover{text-decoration:underline}

/* HERO */
.hero{text-align:center;padding:2.5rem 1.5rem 1.2rem;max-width:800px;margin:0 auto}
.hero h1{font-family:'Fraunces',serif;font-size:2rem;font-weight:800;margin-bottom:.4rem}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-size:.88rem;max-width:560px;margin:0 auto;line-height:1.55}

/* PLATFORM TABS */
.tabs{max-width:1200px;margin:0 auto;padding:.4rem 24px 1rem;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{padding:7px 16px;border:1px solid var(--line);border-radius:99px;font-size:.75rem;font-weight:600;cursor:pointer;background:var(--panel);font-family:inherit;transition:all .15s;color:var(--muted)}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent);border-color:var(--accent);color:white}

/* PLATFORM SECTIONS */
.content{max-width:1200px;margin:0 auto;padding:0 24px 3rem}
.platform-section{margin-bottom:2rem}
.platform-section.hidden{display:none}
.platform-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:.6rem;border-bottom:2px solid var(--line)}
.platform-logo{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:white;flex-shrink:0;font-weight:700}
.platform-name{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700}
.platform-count{font-size:.7rem;color:var(--muted);font-weight:600;background:var(--bg);padding:2px 8px;border-radius:99px;border:1px solid var(--line)}

/* FORMAT CARDS */
.formats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.format-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.format-card:hover{border-color:#d1d5db;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.format-top{padding:16px 18px 12px;display:flex;gap:14px;align-items:flex-start}
.format-visual{width:72px;height:54px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
.format-visual .ratio-label{font-size:.55rem;font-weight:700;color:var(--muted);position:absolute;bottom:2px;right:3px}
.format-info{flex:1;min-width:0}
.format-name{font-size:.9rem;font-weight:700;margin-bottom:2px}
.format-platform-badge{display:inline-block;font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em;color:white;margin-bottom:6px}

/* SPEC TABLE */
.spec-table{width:100%;border-collapse:collapse;font-size:.72rem}
.spec-table th{text-align:left;font-weight:600;color:var(--muted);padding:4px 12px;border-bottom:1px solid var(--line);font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
.spec-table td{padding:5px 12px;border-bottom:1px solid #f3f4f6;vertical-align:top}
.spec-table tr:last-child td{border-bottom:none}
.spec-label{color:var(--muted);font-weight:500;width:110px}
.spec-value{font-weight:600;color:var(--text)}
.spec-value .rec{color:var(--accent);font-weight:700;font-size:.65rem;margin-left:4px}
.spec-value .min{color:var(--muted);font-weight:400;font-size:.65rem;margin-left:4px}

/* PRO TIP */
.pro-tip{padding:8px 18px 12px;border-top:1px solid var(--line);display:flex;align-items:flex-start;gap:6px;background:#fffbeb}
.pro-tip .tip-icon{font-size:.75rem;flex-shrink:0;margin-top:1px}
.pro-tip .tip-text{font-size:.68rem;color:#92400e;line-height:1.45;font-weight:500}

/* COPY BUTTON */
.copy-row{padding:0 18px 12px;display:flex;justify-content:flex-end}
.btn-copy{padding:5px 12px;border-radius:6px;font-size:.68rem;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--line);background:var(--panel);color:var(--muted);transition:all .12s;display:flex;align-items:center;gap:4px}
.btn-copy:hover{border-color:var(--accent);color:var(--accent)}
.btn-copy.copied{border-color:var(--green);color:var(--green);background:#f0fdf4}

/* CSS VISUALS FOR FORMAT CARDS */
.vis-search{display:flex;flex-direction:column;gap:2px;padding:6px;width:100%}
.vis-search .vis-line{height:3px;border-radius:1px;background:var(--line)}
.vis-search .vis-line.title{background:var(--blue);width:80%}
.vis-search .vis-line.url{background:var(--green);width:50%}
.vis-search .vis-line.desc{width:90%}

.vis-display{padding:4px;width:100%;height:100%;display:flex;flex-direction:column}
.vis-display .vis-img{flex:1;background:linear-gradient(135deg,var(--accent-light),#fde8e8);border-radius:3px}
.vis-display .vis-bar{height:6px;background:var(--accent);border-radius:1px;margin-top:3px;width:60%}

.vis-shopping{padding:4px;width:100%;text-align:center}
.vis-shopping .vis-box{width:30px;height:30px;background:var(--line);border-radius:3px;margin:0 auto 3px;border:1px solid #d1d5db}
.vis-shopping .vis-price{font-size:.5rem;font-weight:700;color:var(--accent)}

.vis-video{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a1a,#374151)}
.vis-video .play{width:16px;height:16px;background:white;border-radius:50%;position:relative}
.vis-video .play::after{content:'';position:absolute;left:6px;top:4px;border-left:6px solid #374151;border-top:4px solid transparent;border-bottom:4px solid transparent}
.vis-video .duration{position:absolute;bottom:2px;right:4px;font-size:.45rem;color:white;font-weight:600;background:rgba(0,0,0,.6);padding:0 3px;border-radius:1px}

.vis-bumper{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fef2f2,#fde8e8)}
.vis-bumper .six{font-size:1.1rem;font-weight:800;color:var(--accent)}
.vis-bumper .sec{font-size:.5rem;font-weight:600;color:var(--accent);margin-top:-2px}

.vis-feed{padding:4px;width:100%;display:flex;flex-direction:column;gap:2px}
.vis-feed .vis-avatar{width:8px;height:8px;border-radius:50%;background:var(--line)}
.vis-feed .vis-img-rect{flex:1;min-height:20px;background:linear-gradient(135deg,#dbeafe,#eff6ff);border-radius:2px}
.vis-feed .vis-text-line{height:2px;background:var(--line);border-radius:1px;width:70%}

.vis-stories{width:100%;height:100%;background:linear-gradient(180deg,#ec4899,#8b5cf6);border-radius:4px;display:flex;align-items:center;justify-content:center}
.vis-stories .vis-inner{width:28px;height:42px;border:1px solid rgba(255,255,255,.5);border-radius:4px}

.vis-carousel{display:flex;gap:2px;padding:6px;align-items:center;width:100%}
.vis-carousel .vis-card{width:18px;height:24px;background:var(--line);border-radius:2px;flex-shrink:0}
.vis-carousel .vis-card:first-child{background:var(--blue);opacity:.7}
.vis-carousel .vis-card:nth-child(2){background:var(--blue);opacity:.5}
.vis-carousel .vis-card:nth-child(3){background:var(--blue);opacity:.3}

.vis-message{padding:6px;width:100%;display:flex;flex-direction:column;gap:3px}
.vis-message .vis-bubble{padding:3px 6px;background:var(--blue);border-radius:4px 4px 4px 0;font-size:.4rem;color:white;align-self:flex-start;max-width:80%}
.vis-message .vis-bubble.reply{background:var(--line);color:var(--text);align-self:flex-end;border-radius:4px 4px 0 4px}

.vis-text-ad{padding:6px;width:100%;display:flex;align-items:center;gap:4px}
.vis-text-ad .vis-thumb{width:16px;height:16px;background:var(--line);border-radius:2px}
.vis-text-ad .vis-lines{display:flex;flex-direction:column;gap:2px;flex:1}
.vis-text-ad .vis-lines span{height:2px;background:var(--line);border-radius:1px;display:block}
.vis-text-ad .vis-lines span:first-child{width:60%;background:var(--blue)}

.vis-vertical{width:100%;height:100%;background:linear-gradient(180deg,#000,#1a1a1a);display:flex;align-items:center;justify-content:center;border-radius:4px}
.vis-vertical .vis-phone{width:22px;height:36px;border:1px solid #4b5563;border-radius:4px;display:flex;align-items:center;justify-content:center}
.vis-vertical .vis-phone .tri{width:0;height:0;border-left:5px solid white;border-top:3px solid transparent;border-bottom:3px solid transparent}

.vis-collection{padding:4px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.vis-collection .vis-main{grid-column:1/3;height:18px;background:linear-gradient(135deg,#dbeafe,#eff6ff);border-radius:2px}
.vis-collection .vis-thumb-sm{height:12px;background:var(--line);border-radius:2px}

.vis-hashtag{width:100%;height:100%;background:linear-gradient(135deg,#000,#1a1a1a);display:flex;align-items:center;justify-content:center}
.vis-hashtag .hash{font-size:1.2rem;font-weight:800;color:var(--cyan)}

.vis-takeover{width:100%;height:100%;background:linear-gradient(135deg,var(--accent-light),#fff);display:flex;align-items:center;justify-content:center;position:relative}
.vis-takeover .vis-star{font-size:1rem;color:var(--accent)}
.vis-takeover .vis-label{position:absolute;bottom:2px;font-size:.4rem;font-weight:700;color:var(--accent)}

.vis-discovery{padding:6px;width:100%;display:flex;gap:4px;align-items:center}
.vis-discovery .vis-thumb-lg{width:28px;height:22px;background:var(--line);border-radius:2px;display:flex;align-items:center;justify-content:center}
.vis-discovery .vis-thumb-lg .tri-sm{width:0;height:0;border-left:4px solid var(--muted);border-top:3px solid transparent;border-bottom:3px solid transparent}
.vis-discovery .vis-meta{display:flex;flex-direction:column;gap:2px;flex:1}
.vis-discovery .vis-meta span{height:2px;background:var(--line);border-radius:1px;display:block}
.vis-discovery .vis-meta span:first-child{width:90%;background:#374151}

.vis-shorts{width:100%;height:100%;background:linear-gradient(180deg,#ff0000,#cc0000);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.vis-shorts .vis-shorts-icon{font-size:.6rem;font-weight:800;color:white}
.vis-shorts .vis-shorts-label{font-size:.35rem;font-weight:700;color:rgba(255,255,255,.7)}

.vis-pin{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fef2f2,#fee2e2);border-radius:8px}
.vis-pin .vis-pin-inner{width:24px;height:34px;background:white;border-radius:8px 8px 8px 0;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transform:rotate(-15deg)}
.vis-pin .vis-pin-inner .vis-pin-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

.vis-idea{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fffbeb,#fef3c7)}
.vis-idea .bulb{font-size:1rem}

.vis-spark{width:100%;height:100%;background:linear-gradient(180deg,#000,#1a1a1a);display:flex;align-items:center;justify-content:center;border-radius:4px}
.vis-spark .spark-icon{font-size:.7rem;color:var(--cyan);display:flex;align-items:center;gap:2px;font-weight:700}

/* FOOTER */
footer{border-top:1px solid var(--line);padding:1rem;text-align:center;font-size:.7rem;color:var(--muted);background:var(--panel)}
footer a{color:var(--accent)}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a1a;color:white;padding:10px 20px;border-radius:8px;font-size:.78rem;font-weight:600;transition:transform .3s ease;z-index:100;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:800px){
  .hero h1{font-size:1.5rem}
  .formats-grid{grid-template-columns:1fr}
  .tabs{gap:4px}
  .tab{padding:6px 12px;font-size:.7rem}
  .content{padding:0 12px 2rem}
}
</style>
</head>
<body>

<div class="top-bar">
  <a class="back" href="/">&larr; FreeAdStore</a>
</div>

<section class="hero">
  <h1>Ad Format <span>Reference</span></h1>
  <p>Every ad format, every platform. Dimensions, character limits, file sizes.</p>

  <button class="tab active" data-platform="all">All</button>
  <button class="tab" data-platform="google">Google</button>
  <button class="tab" data-platform="meta">Meta</button>
  <button class="tab" data-platform="linkedin">LinkedIn</button>
  <button class="tab" data-platform="tiktok">TikTok</button>
  <button class="tab" data-platform="x">X</button>
  <button class="tab" data-platform="youtube">YouTube</button>
  <button class="tab" data-platform="amazon">Amazon</button>

</div>

<div class="content" id="content"></div>

<footer>
  <a href="/">FreeAdStore</a> &mdash; Free advertising tools. No signup, no tracking.
</footer>

<div class="toast" id="toast">Specs copied to clipboard</div>

function getVisualHTML(visual) {

    search: `<div class="vis-search"><div class="vis-line title"></div><div class="vis-line url"></div><div class="vis-line desc"></div><div class="vis-line desc" style="width:70%"></div></div>`,

    shopping: `<div class="vis-shopping"><div class="vis-box"></div><div class="vis-price">$29.99</div></div>`,
    video: `<div class="vis-video"><div class="play"></div><div class="duration">0:30</div></div>`,
    bumper: `<div class="vis-bumper"><div class="six">6s</div></div>`,
    feed: `<div class="vis-feed"><div class="vis-avatar"></div><div class="vis-img-rect"></div><div class="vis-text-line"></div></div>`,
    stories: `<div class="vis-stories"><div class="vis-inner"></div></div>`,
    carousel: `<div class="vis-carousel"><div class="vis-card"></div><div class="vis-card"></div><div class="vis-card"></div><div class="vis-card"></div></div>`,
    collection: `<div class="vis-collection"><div class="vis-main"></div><div class="vis-thumb-sm"></div><div class="vis-thumb-sm"></div></div>`,
    message: `<div class="vis-message"><div class="vis-bubble">Hi there!</div><div class="vis-bubble reply">Learn more</div></div>`,
    'text-ad': `<div class="vis-text-ad"><div class="vis-thumb"></div><div class="vis-lines"><span></span><span style="width:80%"></span></div></div>`,
    vertical: `<div class="vis-vertical"><div class="vis-phone"><div class="tri"></div></div></div>`,
    hashtag: `<div class="vis-hashtag"><div class="hash">#</div></div>`,
    takeover: `<div class="vis-takeover"><div class="vis-star">&#9733;</div><div class="vis-label">TOP</div></div>`,
    discovery: `<div class="vis-discovery"><div class="vis-thumb-lg"><div class="tri-sm"></div></div><div class="vis-meta"><span></span><span style="width:60%"></span></div></div>`,
    shorts: `<div class="vis-shorts"><div class="vis-shorts-icon">S</div><div class="vis-shorts-label">SHORTS</div></div>`,
    pin: `<div class="vis-pin"><div class="vis-pin-inner"><div class="vis-pin-dot"></div></div></div>`,
    idea: `<div class="vis-idea"><div class="bulb">&#9670;</div></div>`,
    spark: `<div class="vis-spark"><div class="spark-icon">&#9889; Spark</div></div>`,
  };

}

function buildSpecsText(platform, fmt) {
  let t = `${fmt.name} (${platform.name})\n`;
  t += `${'='.repeat(40)}\n`;
  t += `Dimensions: ${fmt.dimensions}\n`;
  t += `Aspect Ratio: ${fmt.aspect}\n\n`;
  t += `Specs:\n`;
  fmt.specs.forEach(s => {
    let line = `  ${s[0]}: ${s[1]}`;
    if (s[2]) line += ` (min: ${s[2]})`;
    t += line + '\n';
  });
  t += `\nFile Size: ${fmt.fileSize}\n`;
  t += `\nPro Tip: ${fmt.tip}\n`;
  return t;
}

function showToast(msg) {
  toast.textContent = msg || 'Specs copied to clipboard';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function renderPlatform(p) {
  let html = `<section class="platform-section" data-platform="${p.id}">`;
  html += `<div class="platform-header">`;
  html += `<div class="platform-logo" style="background:${p.color}">${p.icon}</div>`;
  html += `<span class="platform-name">${p.name}</span>`;
  html += `<span class="platform-count">${p.formats.length} formats</span>`;
  html += `</div>`;
  html += `<div class="formats-grid">`;

  p.formats.forEach((fmt, i) => {
    const cardId = `${p.id}-${i}`;
    html += `<div class="format-card" id="${cardId}">`;
    html += `<div class="format-top">`;
    html += `<div class="format-visual">${getVisualHTML(fmt.visual)}<span class="ratio-label">${fmt.aspect.split(' ')[0]}</span></div>`;
    html += `<div class="format-info">`;
    html += `<div class="format-name">${fmt.name}</div>`;
    html += `<span class="format-platform-badge" style="background:${p.color}">${p.name}</span>`;
    html += `</div>`;
    html += `</div>`;

    /* Spec table */
    html += `<table class="spec-table"><thead><tr><th>Property</th><th>Specification</th></tr></thead><tbody>`;
    html += `<tr><td class="spec-label">Dimensions</td><td class="spec-value">${fmt.dimensions}</td></tr>`;
    html += `<tr><td class="spec-label">Aspect Ratio</td><td class="spec-value">${fmt.aspect}</td></tr>`;
    fmt.specs.forEach(s => {
      let val = `${s[1]}`;
      if (s[2]) val += `<span class="min">(min: ${s[2]})</span>`;
      html += `<tr><td class="spec-label">${s[0]}</td><td class="spec-value">${val}</td></tr>`;
    });
    html += `<tr><td class="spec-label">File Size</td><td class="spec-value">${fmt.fileSize}</td></tr>`;
    html += `</tbody></table>`;

    /* Pro tip */
    html += `<div class="pro-tip"><span class="tip-icon">&#9889;</span><span class="tip-text"><strong>Pro tip:</strong> ${fmt.tip}</span></div>`;

    /* Copy button */
    html += `<div class="copy-row"><button class="btn-copy" data-platform="${p.id}" data-index="${i}" onclick="copySpecs('${p.id}',${i},this)">`;
    html += `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
    html += `Copy specs</button></div>`;

    html += `</div>`;
  });

  html += `</div></section>`;
  return html;
}

function copySpecs(platformId, index, btn) {
  const platform = PLATFORMS.find(p => p.id === platformId);
  const fmt = platform.formats[index];
  const text = buildSpecsText(platform, fmt);
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
    showToast();
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy specs`;
    }, 2000);
  });
}

/* ── INITIAL RENDER ───────────────────────────────────────────────────── */
content.innerHTML = PLATFORMS.map(p => renderPlatform(p)).join('');

/* ── TABS ─────────────────────────────────────────────────────────────── */
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  const platform = tab.dataset.platform;

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');

  document.querySelectorAll('.platform-section').forEach(s => {
    if (platform === 'all') {
      s.classList.remove('hidden');
    } else {
      s.classList.toggle('hidden', s.dataset.platform !== platform);
    }
  });

  /* Smooth scroll to top of content */
  if (platform !== 'all') {
    const target = document.querySelector(`.platform-section[data-platform="${platform}"]`);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

/* ── TOTAL COUNT ──────────────────────────────────────────────────────── */
const totalFormats = PLATFORMS.reduce((sum, p) => sum + p.formats.length, 0);
document.querySelector('.hero p').textContent += ` ${totalFormats} formats across ${PLATFORMS.length} platforms.`;
</script>
</body>
</html>
