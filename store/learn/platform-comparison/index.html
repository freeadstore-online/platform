<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--text:#1a1a1a;--muted:#6b7280;--accent:#ef4444;--accent-light:#fef2f2;--panel:#ffffff;--line:#e5e7eb;--radius:10px;--green:#22c55e;--blue:#3b82f6;--purple:#8b5cf6;--orange:#f97316;--cyan:#06b6d4;--pink:#ec4899;--yellow:#eab308;--teal:#14b8a6}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a.back{display:inline-block;padding:14px 16px;color:var(--accent);text-decoration:none;font-weight:500;font-size:.85rem}
a.back:hover{text-decoration:underline}

/* PAGE LAYOUT */
.page{max-width:1200px;margin:0 auto;padding:0 16px 60px}
.page-head{padding:0 0 8px;margin-bottom:4px}
.page-head h1{font-size:1.8rem;font-weight:800;font-family:'Fraunces',serif;margin-bottom:4px;line-height:1.2}
.page-head p{font-size:.88rem;color:var(--muted);max-width:600px;line-height:1.5}

/* FILTER BAR */
.filter-bar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:24px}
.filter-group{margin-bottom:12px}
.filter-group:last-child{margin-bottom:0}
.filter-label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.pill-row{display:flex;gap:5px;flex-wrap:wrap}
.pill{padding:5px 13px;border:1px solid var(--line);border-radius:6px;font-size:.73rem;font-weight:600;cursor:pointer;background:var(--panel);font-family:inherit;transition:all .12s;color:var(--text)}
.pill:hover{border-color:var(--accent)}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* QUICK PICK */
.quick-pick{background:var(--accent-light);border:1px solid #fecaca;border-radius:14px;padding:18px 22px;margin-bottom:24px;display:none}
.quick-pick.visible{display:block}
.quick-pick-title{font-size:.78rem;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.quick-pick-title svg{width:16px;height:16px}
.quick-pick-list{display:flex;flex-wrap:wrap;gap:8px}
.quick-pick-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600}
.quick-pick-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quick-pick-icon svg{width:16px;height:16px;color:#fff}
.quick-pick-reason{font-size:.68rem;color:var(--muted);font-weight:400;margin-left:4px}

/* RESULTS COUNT */
.results-count{font-size:.78rem;color:var(--muted);margin-bottom:16px;font-weight:500}
.results-count span{font-weight:700;color:var(--text)}

/* PLATFORM CARDS */
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.07)}
.card.hidden{display:none}
.card-header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.card-logo{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-logo svg{width:22px;height:22px;color:#fff}
.card-title-block h3{font-size:1rem;font-weight:800;line-height:1.2}
.card-title-block .card-users{font-size:.68rem;color:var(--muted);font-weight:500}
.card-body{padding:16px 20px}
.card-best-for{font-size:.75rem;color:var(--muted);margin-bottom:12px;line-height:1.4}
.card-best-for strong{color:var(--text);font-weight:700}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:8px;padding:8px 10px;text-align:center}
.stat .stat-label{font-size:.6rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.stat .stat-value{font-size:.88rem;font-weight:800;font-family:'Fraunces',serif}

/* DETAILS */
.card-section{margin-bottom:10px}
.card-section:last-child{margin-bottom:0}
.card-section-label{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.tag-row{display:flex;flex-wrap:wrap;gap:4px}
.tag{padding:3px 8px;border-radius:4px;font-size:.65rem;font-weight:500;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.tag.strength{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.tag.weakness{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.tag.industry{background:#eff6ff;color:#1e40af;border-color:#bfdbfe}

/* RESPONSIVE */
@media(max-width:900px){
  .cards-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .page-head h1{font-size:1.4rem}
}
@media(max-width:500px){
  .stat-grid{grid-template-columns:1fr}
  .pill{padding:4px 10px;font-size:.68rem}
  .filter-bar{padding:12px 14px}
}

/* PRINT */
@media print{
  a.back,.filter-bar,.quick-pick{display:none!important}
  .cards-grid{grid-template-columns:1fr}
  .card{break-inside:avoid;border:1px solid #ddd}
  body{background:#fff}
  @page{margin:1.5cm}
}
</style>

    icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.017 0C5.396 0 .029 5.367.029 11.987c0 5.079 3.158 9.417 7.618 11.162-.105-.949-.199-2.403.041-3.439.219-.937 1.406-5.957 1.406-5.957s-.359-.72-.359-1.781c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738a.36.36 0 01.083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12.017 24c6.624 0 11.99-5.367 11.99-11.988C24.007 5.367 18.641 0 12.017 0z"/></svg>',
    users: '480M+ monthly active users',
    bestFor: 'Visual discovery, shopping inspiration, lifestyle brands',
    formats: ['Standard Pin', 'Video', 'Carousel', 'Shopping', 'Idea Pin'],
    targeting: ['Keywords', 'Interests', 'Demographics', 'Actalikes', 'Customer lists'],
    stats: [
      { label: 'Avg CPC', value: '$0.50-$2' },
      { label: 'Avg CTR', value: '0.5-1.5%' },
      { label: 'Min Budget', value: '$1/day' }
    ],
    strengths: ['High purchase intent', 'Long content lifespan', 'Visual discovery'],
    weaknesses: ['Smaller audience', 'Limited targeting', 'Niche'],
    industries: ['Home Decor', 'Fashion', 'Food', 'Beauty', 'Wedding', 'DIY'],
    goals: ['awareness', 'traffic', 'sales'],
    budgets: ['under500', '500-2k', '2k-10k'],
    audience: 'b2c'
  }
];

const QUICK_PICK_REASONS = {
  'awareness': {
    google: 'Massive reach via Display Network',
    meta: 'Best visual brand building',
    tiktok: 'Highest organic engagement',
    youtube: 'Video storytelling at scale',
    pinterest: 'Long-lasting visual impressions'
  },
  'traffic': {
    google: 'Highest intent clicks',
    meta: 'Low CPC + precise targeting',
    tiktok: 'Viral potential for young audiences',
    x: 'Real-time trending traffic',
    youtube: 'Discovery-driven clicks'
  },
  'leads': {
    google: 'Search captures active demand',
    meta: 'Lead forms + lookalikes',
    linkedin: 'Best B2B lead quality'
  },
  'sales': {
    google: 'Shopping + search intent',
    meta: 'Retargeting + dynamic ads',
    amazon: 'Direct-to-checkout, highest ROAS',
    pinterest: 'Purchase-ready discovery'
  },
  'app-installs': {
    google: 'Universal App Campaigns',
    meta: 'App install optimization',
    tiktok: 'Young mobile-first audience'
  }
};

let currentGoal = 'all';
let currentBudget = 'all';
let currentAudience = 'all';

function initFilters() {
  document.querySelectorAll('.pill-row').forEach(row => {
    row.addEventListener('click', e => {
      const pill = e.target.closest('.pill');
      if (!pill) return;
      row.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');

      const id = row.id;
      const val = pill.dataset.value;
      if (id === 'goal-pills') currentGoal = val;
      else if (id === 'budget-pills') currentBudget = val;
      else if (id === 'audience-pills') currentAudience = val;

      applyFilters();
    });
  });
}

function applyFilters() {
  let visible = 0;
  PLATFORMS.forEach(p => {
    const card = document.getElementById('card-' + p.id);
    let show = true;

    if (currentGoal !== 'all' && !p.goals.includes(currentGoal)) show = false;
    if (currentBudget !== 'all' && !p.budgets.includes(currentBudget)) show = false;
    if (currentAudience !== 'all') {
      if (currentAudience === 'both') {
        if (p.audience !== 'both') show = false;
      } else {
        if (p.audience !== currentAudience && p.audience !== 'both') show = false;
      }
    }

    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });

  document.getElementById('results-count').innerHTML =
    `Showing <span>${visible}</span> of ${PLATFORMS.length} platforms`;

  updateQuickPick();
}

function updateQuickPick() {
  const qp = document.getElementById('quick-pick');
  const list = document.getElementById('quick-pick-list');

  if (currentGoal === 'all' && currentBudget === 'all' && currentAudience === 'all') {
    qp.classList.remove('visible');
    return;
  }

  const visiblePlatforms = PLATFORMS.filter(p => {
    if (currentGoal !== 'all' && !p.goals.includes(currentGoal)) return false;
    if (currentBudget !== 'all' && !p.budgets.includes(currentBudget)) return false;
    if (currentAudience !== 'all') {
      if (currentAudience === 'both') {
        if (p.audience !== 'both') return false;
      } else {
        if (p.audience !== currentAudience && p.audience !== 'both') return false;
      }
    }
    return true;
  });

  if (visiblePlatforms.length === 0 || visiblePlatforms.length === PLATFORMS.length) {
    qp.classList.remove('visible');
    return;
  }

  const reasons = currentGoal !== 'all' ? QUICK_PICK_REASONS[currentGoal] || {} : {};

  const topPicks = visiblePlatforms.slice(0, 3);

  list.innerHTML = topPicks.map(p => {
    const reason = reasons[p.id] || p.bestFor.split(',')[0].trim();
    return `<div class="quick-pick-item">
      <div class="quick-pick-icon" style="background:${p.color}">${p.icon}</div>
      <div>
        <div>${p.name}</div>
        <div class="quick-pick-reason">${reason}</div>
      </div>
    </div>`;
  }).join('');

  qp.classList.add('visible');
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = PLATFORMS.map(p => `
    <div class="card" id="card-${p.id}">
      <div class="card-header" style="border-top:3px solid ${p.color}">
        <div class="card-logo" style="background:${p.color}">${p.icon}</div>
        <div class="card-title-block">
          <h3>${p.name}</h3>
          <div class="card-users">${p.users}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-best-for"><strong>Best for:</strong> ${p.bestFor}</div>

        <div class="stat-grid">
          ${p.stats.map(s => `
            <div class="stat">
              <div class="stat-label">${s.label}</div>
              <div class="stat-value">${s.value}</div>
            </div>
          `).join('')}
        </div>

        <div class="card-section">
          <div class="card-section-label">Ad Formats</div>
          <div class="tag-row">${p.formats.map(f => `<span class="tag">${f}</span>`).join('')}</div>
        </div>

        <div class="card-section">
          <div class="card-section-label">Targeting</div>
          <div class="tag-row">${p.targeting.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>

        <div class="card-section">
          <div class="card-section-label">Strengths</div>
          <div class="tag-row">${p.strengths.map(s => `<span class="tag strength">${s}</span>`).join('')}</div>
        </div>

        <div class="card-section">
          <div class="card-section-label">Weaknesses</div>
          <div class="tag-row">${p.weaknesses.map(w => `<span class="tag weakness">${w}</span>`).join('')}</div>
        </div>

        <div class="card-section">
          <div class="card-section-label">Best Industries</div>
          <div class="tag-row">${p.industries.map(i => `<span class="tag industry">${i}</span>`).join('')}</div>
        </div>
      </div>
    </div>
  `).join('');
}

function init() {
  renderCards();
  initFilters();
  applyFilters();
}

init();
</script>
</body>
</html>
